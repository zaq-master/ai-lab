<!doctype html><html lang="ja"><head><meta charset="UTF-8"><style>
@font-face{font-family:R;src:url("assets/fonts/MPLUSRounded1c-ExtraBold.ttf");font-weight:800}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;font-family:R;background:radial-gradient(ellipse at 60% 30%,#2d3577 0%,#171b42 62%,#0e1130 100%)}
.big{font-weight:800;color:#fff;-webkit-text-stroke:12px #1c2150;paint-order:stroke fill;text-shadow:6px 6px 0 #1c2150}
.hz{font-weight:800;color:#FFE23A;-webkit-text-stroke:10px #fff;paint-order:stroke fill;text-shadow:7px 0 0 #FF3D7F,-7px 0 0 #FF3D7F,0 7px 0 #FF3D7F,0 -7px 0 #FF3D7F,5px 5px 0 #FF3D7F,-5px 5px 0 #FF3D7F,0 13px 0 #A3124F,0 19px 0 #A3124F}
</style></head><body>
<div class="big" style="position:absolute;top:30px;left:380px;width:880px;text-align:center;font-size:76px;line-height:1.2">くじ引きは<br><span class="hz" style="font-size:104px">先に引いた人</span>が得？</div>
<svg id="s" width="900" height="380" style="position:absolute;top:320px;left:415px;font-family:R"></svg>
<div class="big" style="position:absolute;top:40px;left:24px;font-size:50px;transform:rotate(-6deg)"><span class="hz" style="font-size:64px">1万回</span><br>ためした</div>
<img src="assets/alice/surprised_768.png" style="position:absolute;left:-10px;bottom:-210px;width:440px;filter:drop-shadow(5px 0 0 #fff) drop-shadow(-5px 0 0 #fff) drop-shadow(0 -5px 0 #fff)">
<script>
const COL=["#ef4444","#f97316","#84cc16","#10b981","#06b6d4","#3b82f6","#6366f1","#a855f7","#ec4899","#8d6e63"];
let h="";
for(let i=0;i<10;i++){const x=40+87*i,y=360;h+=`<g transform="translate(${x},${y}) scale(1.0)"><rect x="-31" y="-86" width="62" height="86" rx="24" fill="${COL[i]}" stroke="#1c2150" stroke-width="4"/><text x="0" y="-30" text-anchor="middle" font-size="36" font-weight="800" fill="#fff" stroke="#1c2150" stroke-width="5" paint-order="stroke">${i+1}</text><circle cx="0" cy="-114" r="29" fill="#ffe3c8" stroke="#1c2150" stroke-width="4"/><path d="M-29,-116 a29,29 0 0 1 58,0 q-29,-14 -58,0z" fill="#3b2f4a"/><circle cx="-10" cy="-108" r="4" fill="#1c2150"/><circle cx="10" cy="-108" r="4" fill="#1c2150"/></g>`;
 h+=`<g transform="translate(${x},${y-200})"><rect x="-26" y="-40" width="52" height="80" rx="9" fill="#fff" stroke="#1c2150" stroke-width="4"/><text x="0" y="15" text-anchor="middle" font-size="42" font-weight="800" fill="#1c2150">?</text></g>`;}
h+=`<text x="48" y="60" font-size="34" font-weight="800" fill="#ff8a80">← 先に引く</text><text x="830" y="60" text-anchor="end" font-size="34" font-weight="800" fill="#8fc4ff">後に引く →</text>`;
document.getElementById("s").innerHTML=h;
</script></body></html>
