<!doctype html><html lang="ja"><head><meta charset="UTF-8"><style>
@font-face{font-family:R;src:url("assets/fonts/MPLUSRounded1c-ExtraBold.ttf");font-weight:800}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:R;background:radial-gradient(ellipse at 50% 30%,#2d3577 0%,#171b42 62%,#0e1130 100%)}
.big{font-weight:800;color:#fff;-webkit-text-stroke:16px #1c2150;paint-order:stroke fill;text-shadow:8px 8px 0 #1c2150}
.hz{font-weight:800;color:#FFE23A;-webkit-text-stroke:12px #fff;paint-order:stroke fill;text-shadow:8px 0 0 #FF3D7F,-8px 0 0 #FF3D7F,0 8px 0 #FF3D7F,0 -8px 0 #FF3D7F,6px 6px 0 #FF3D7F,-6px 6px 0 #FF3D7F,0 16px 0 #A3124F,0 24px 0 #A3124F}
</style></head><body>
<div class="big" style="position:absolute;top:120px;width:100%;text-align:center;font-size:120px;line-height:1.2">くじ引きは<br><span class="hz" style="font-size:150px">先に引いた人</span><br>が得？</div>
<svg id="s" width="1080" height="760" style="position:absolute;top:640px;left:0;font-family:R"></svg>
<div class="big" style="position:absolute;top:1420px;left:50px;width:440px;text-align:center;font-size:96px;line-height:1.25;transform:rotate(-4deg)"><span class="hz" style="font-size:120px">1万回</span><br>ためした</div>
<img src="assets/alice/surprised_768.png" style="position:absolute;right:40px;bottom:-200px;width:620px;filter:drop-shadow(6px 0 0 #fff) drop-shadow(-6px 0 0 #fff) drop-shadow(0 -6px 0 #fff)">
<script>
const COL=["#ef4444","#f97316","#84cc16","#10b981","#06b6d4","#3b82f6","#6366f1","#a855f7","#ec4899","#8d6e63"];
let h=`<g transform="translate(540,190) scale(1.6)">`;for(let j=0;j<10;j++)h+=`<rect x="${-118+j*25}" y="-96" width="16" height="80" rx="7" fill="#fff" stroke="#1c2150" stroke-width="3"/>`;
h+=`<rect x="-150" y="-40" width="300" height="160" rx="24" fill="#6c5ce7" stroke="#1c2150" stroke-width="5"/><text x="0" y="62" text-anchor="middle" font-size="56" font-weight="800" fill="#fff">くじ</text></g>`;
for(let i=0;i<10;i++){const x=60+96*i,y=660;h+=`<g transform="translate(${x},${y}) scale(1.05)"><rect x="-31" y="-86" width="62" height="86" rx="24" fill="${COL[i]}" stroke="#1c2150" stroke-width="4"/><text x="0" y="-30" text-anchor="middle" font-size="36" font-weight="800" fill="#fff" stroke="#1c2150" stroke-width="5" paint-order="stroke">${i+1}</text><circle cx="0" cy="-114" r="29" fill="#ffe3c8" stroke="#1c2150" stroke-width="4"/><path d="M-29,-116 a29,29 0 0 1 58,0 q-29,-14 -58,0z" fill="#3b2f4a"/><circle cx="-10" cy="-108" r="4" fill="#1c2150"/><circle cx="10" cy="-108" r="4" fill="#1c2150"/></g>`;
 h+=`<g transform="translate(${x},${y-210})"><rect x="-24" y="-36" width="48" height="72" rx="9" fill="#fff" stroke="#1c2150" stroke-width="4"/><text x="0" y="14" text-anchor="middle" font-size="38" font-weight="800" fill="#1c2150">?</text></g>`;}
document.getElementById("s").innerHTML=h;
</script></body></html>
