<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/lib/gsap.min.js"></script>
    <script src="assets/lib/motion.js"></script>
    <script src="assets/data.js"></script>
    <style>
      @font-face { font-family: R; src: url("assets/fonts/MPLUSRounded1c-ExtraBold.ttf"); font-weight: 800; }
      @font-face { font-family: R; src: url("assets/fonts/MPLUSRounded1c-Bold.ttf"); font-weight: 700; }
      :root { --navy: #1c2150; --gold: #ffd84a; --hit: #ffc928; --miss: #b9bdd0; --red: #ff5a4e; --blue: #4da3ff; --ink: #1c2150; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #14183a; font-family: R, sans-serif; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #bg { position: absolute; inset: 0; }
      #dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.07) 3px, transparent 3.5px); background-size: 48px 48px; }
      #ui { position: absolute; inset: 0; }
      #cam { position: absolute; inset: 0; transform-origin: 1200px 520px; }
      .big { font-weight: 800; color: #fff; -webkit-text-stroke: 12px var(--navy); paint-order: stroke fill; text-shadow: 6px 6px 0 var(--navy); }
      #title { position: absolute; left: 525px; width: 1350px; top: 34px; text-align: center; font-size: 64px; line-height: 1.2; white-space: nowrap; }
      #title br { display: none; }
      #qcard { position: absolute; left: 30px; top: 100px; width: 470px; text-align: center; font-size: 44px; line-height: 1.3; }
      #stage { position: absolute; left: 525px; top: 132px; width: 1350px; height: 760px; }
      #cv { position: absolute; left: 525px; top: 132px; width: 1350px; height: 760px; }
      #over { position: absolute; left: 525px; top: 132px; width: 1350px; height: 760px; }
      #cap { position: absolute; left: 525px; width: 1350px; top: 932px; text-align: center; font-size: 46px; white-space: pre-line; line-height: 1.3; }
      #alice { position: absolute; left: -10px; bottom: -190px; width: 540px; height: 720px; transform-origin: 50% 100%; filter: drop-shadow(5px 0 0 #fff) drop-shadow(-5px 0 0 #fff) drop-shadow(0 -5px 0 #fff) drop-shadow(8px 10px 0 rgba(0,0,0,.35)); }
      #alice img { position: absolute; inset: 0; width: 540px; height: 720px; transform: scaleX(0.9); transform-origin: 50% 100%; }
      #mark { position: absolute; left: 380px; top: 470px; font-size: 110px; }
      #wipe { position: absolute; inset: -300px; pointer-events: none; }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
      .panel { background: rgba(255,255,255,.97); border-radius: 36px; box-shadow: 0 0 0 8px #F7F9FB, 0 16px 0 rgba(0,0,0,.25); padding: 30px 38px; color: var(--ink); }
      .ph { font-weight: 800; font-size: 44px; text-align: center; margin-bottom: 18px; }
      .note { font-size: 30px; font-weight: 700; color: #5a5f86; text-align: center; margin-top: 12px; }
      .cond { display: flex; gap: 22px; align-items: center; height: 104px; border-bottom: 3px dashed #c9cde6; font-size: 46px; font-weight: 800; }
      .cond:last-child { border-bottom: 0; }
      .cond i { font-style: normal; display: inline-flex; width: 70px; height: 70px; border-radius: 50%; background: var(--ink); color: #fff; align-items: center; justify-content: center; font-size: 38px; }
      .num { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }
      .hz { display: inline-block; font-weight: 800; color: #FFE23A; -webkit-text-stroke: 10px #fff; paint-order: stroke fill;
        text-shadow: 7px 0 0 #FF3D7F, -7px 0 0 #FF3D7F, 0 7px 0 #FF3D7F, 0 -7px 0 #FF3D7F, 5px 5px 0 #FF3D7F, -5px 5px 0 #FF3D7F, 5px -5px 0 #FF3D7F, -5px -5px 0 #FF3D7F, 0 14px 0 #A3124F, 0 20px 0 #A3124F; }
      .fr { display: inline-flex; flex-direction: column; align-items: center; font-size: 62px; font-weight: 800; line-height: 1.0; position: relative; }
      .fr i { display: block; width: 100%; min-width: 74px; height: 6px; background: var(--ink); border-radius: 3px; margin: 6px 0; }
      .fr b { position: relative; }
      .fr b.x { color: #a7abc6; }
      .fr b.x::after { content: ""; position: absolute; left: -6px; right: -6px; top: 50%; height: 6px; background: #ff3d7f; transform: rotate(-35deg); border-radius: 3px; }
      .chip { display: block; font-size: 24px; font-weight: 800; border-radius: 12px; padding: 2px 10px; margin-bottom: 8px; white-space: nowrap; color: var(--ink); }
      .wrow { display: flex; align-items: flex-end; gap: 16px; height: 200px; border-bottom: 3px dashed #c9cde6; padding-bottom: 18px; }
      .wrow:last-child { border-bottom: 0; }
      .op { font-size: 54px; font-weight: 800; margin-bottom: 50px; }
      .pc { display: flex; flex-direction: column; align-items: center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="176.95" data-width="1920" data-height="1080">
      <div id="bg" class="clip" data-start="0" data-duration="176.95" data-track-index="0"></div>
      <div id="ui" class="clip" data-start="0" data-duration="176.95" data-track-index="1" data-layout-allow-overlap data-layout-allow-overflow>
        <div id="dots"></div>
        <div id="cam"><div id="title" class="big"></div><div id="stage"></div><canvas id="cv" width="1350" height="760"></canvas><div id="over"></div></div>
        <div id="qcard" class="big"></div>
        <div id="alice"></div>
        <div id="mark" class="big"></div>
        <div id="cap" class="big"></div>
        <div id="wipe"></div>
        <div id="flash"></div>
        <div style="position:absolute;left:28px;top:56px;font:700 26px R,sans-serif;color:rgba(255,255,255,.85);text-shadow:0 2px 4px rgba(0,0,0,.6)">VOICEVOX:四国めたん</div>
        <div id="credit" style="position:absolute;left:28px;top:24px;font:700 26px R,sans-serif;color:rgba(255,255,255,.7)"></div>
      </div>
      <audio id="mix" class="clip" src="assets/mix.wav" data-start="0" data-duration="176.95" data-track-index="2"></audio>
    </div>
    <script>window.__timelines = window.__timelines || {}; window.__timelines["main"] = gsap.timeline({ paused: true });</script>
    <script>
      const D = window.DATA, K = D.K, R = D.R, ST = D.step;
      const { clamp, lerp, prog, easeOut, easeIn, easeInOut, smooth, backOut, spring, springTo, wob, shakeXY, roll, faceAct, hash } = window.M;
      const $ = (id) => document.getElementById(id);
      const op = (t, t0, d = 0.3) => clamp((t - t0) / d);
      const pop = (t, t0, d = 0.45) => backOut((t - t0) / d);
      const pc = (x) => Math.round(x * 100) + "%";
      const pc1 = (x) => (x * 100).toFixed(1) + "%";
      const SC = Object.fromEntries(D.scenes.map((s) => [s.id, s]));
      const firstOf = (vis) => D.scenes.find((s) => s.vis === vis);
      const VB = D.scenes.filter((s, i) => i && s.vis !== D.scenes[i - 1].vis).map((s) => s.start);
      const NOWIPE = new Set([firstOf("feel").start]);   // 1万個の点の図がそのまま続く所は帯を使わない
      const HITS = [K.d_res, K.ans, K.w2eq, K.f_up, K.th_num].filter((x) => x);
      $("credit").textContent = `AIのシミュレーション（1万回・乱数の種 ${R.seed}）`;

      // 10人の色（何番目の人か）。当たり＝金、はずれ＝灰 は別に固定
      const COL = ["#ef4444", "#f97316", "#84cc16", "#10b981", "#06b6d4", "#3b82f6", "#6366f1", "#a855f7", "#ec4899", "#8d6e63"];
      const CX = (k) => 675 + (k - 4.5) * 132;           // 列（人）の中心 x（ステージ内）
      const ORDER = R.first_round;              // 最初の1回：i番目の人が引いたくじ（0が当たり）
      const WIN = R.first_winner - 1;

      function hz(t, t0, text, size = 110) {
        return [...text].map((ch, i) => { const u = t - (t0 + 0.08 + i * 2 / 30); if (u < 0) return `<span class="hz" style="opacity:0;font-size:${size}px">${ch}</span>`;
          const s = springTo(u), y = -90 * (1 - springTo(u, 0.55, 20)), r = [-7, 4, -3, 6, -5][i % 5] * (1 - springTo(u, 0.45, 18)) + 1.8 * Math.sin(2 * Math.PI * 1.15 * t + i);
          return `<span class="hz" style="font-size:${size}px;transform:translate(0,${y + [6, -12, 8, -10, 4][i % 5]}px) rotate(${r}deg) scale(${s})">${ch}</span>`; }).join("");
      }
      // ---- 人とくじ（SVG） ----
      function person(i, x, y, s = 1, dy = 0, op1 = 1) {
        return `<g transform="translate(${x},${y + dy}) scale(${s})" opacity="${op1}">
          <rect x="-31" y="-86" width="62" height="86" rx="24" fill="${COL[i]}" stroke="#1c2150" stroke-width="4"/>
          <text x="0" y="-30" text-anchor="middle" font-size="36" font-weight="800" fill="#fff" stroke="#1c2150" stroke-width="5" paint-order="stroke">${i + 1}</text>
          <circle cx="0" cy="-114" r="29" fill="#ffe3c8" stroke="#1c2150" stroke-width="4"/>
          <path d="M-29,-116 a29,29 0 0 1 58,0 q-29,-14 -58,0z" fill="#3b2f4a"/>
          <circle cx="-10" cy="-108" r="4" fill="#1c2150"/><circle cx="10" cy="-108" r="4" fill="#1c2150"/></g>`;
      }
      function lot(x, y, state, sx = 1, s = 1, glow = 0) {   // state: c=閉じた, h=当たり, m=はずれ
        const fill = state === "h" ? "#ffc928" : state === "m" ? "#b9bdd0" : "#fff", mk = state === "h" ? "★" : state === "m" ? "×" : "?";
        return `<g transform="translate(${x},${y}) scale(${sx * s},${s})">${glow ? `<circle r="${52 + 6 * glow}" fill="#ffd84a" opacity="${0.45 * glow}"/>` : ""}
          <rect x="-24" y="-36" width="48" height="72" rx="9" fill="${fill}" stroke="#1c2150" stroke-width="4"/>
          <text x="0" y="14" text-anchor="middle" font-size="38" font-weight="800" fill="${state === "m" ? "#fff" : "#1c2150"}">${mk}</text></g>`;
      }
      function box(x, y, n, s = 1) {
        const st = Array.from({ length: n }, (_, j) => `<rect x="${-118 + j * 25}" y="-96" width="16" height="80" rx="7" fill="#fff" stroke="#1c2150" stroke-width="3"/>`).join("");
        return `<g transform="translate(${x},${y}) scale(${s})">${st}<rect x="-150" y="-40" width="300" height="160" rx="24" fill="#6c5ce7" stroke="#1c2150" stroke-width="5"/>
          <text x="0" y="62" text-anchor="middle" font-size="56" font-weight="800" fill="#fff">くじ</text></g>`;
      }
      const FEET = 700, LOTY = 470;
      // ---- 実演（1回目）：i番目の人が引く時刻 ----
      const TD = (i) => K.d_go + i * ST.demo;
      function demoSVG(t) {
        let drawn = 0; for (let i = 0; i < 10; i++) if (t >= TD(i) + 0.05) drawn++;
        let ppl = "", lots = "";
        for (let i = 0; i < 10; i++) {
          const ti = TD(i), dy = t >= ti && t < ti + 0.5 ? -26 * Math.sin(Math.PI * (t - ti) / 0.5) : 0;
          const opened = t >= ti + 0.45, hit = ORDER[i] === 0, win = hit && opened;
          ppl += person(i, CX(i), FEET, 1.12, dy - (win ? 18 * Math.max(0, wob(t - ti - 0.45, 3, 4)) : 0));
          if (t >= ti) {
            const p = easeOut(prog(t, ti, 0.35)), x = lerp(675, CX(i), p), y = lerp(120, LOTY, p) - 60 * Math.sin(Math.PI * p);
            const q = prog(t, ti + 0.35, 0.2), sx = Math.abs(Math.cos(Math.PI * q));
            lots += lot(x, y, q > 0.5 ? (hit ? "h" : "m") : "c", Math.max(0.05, sx), 1, win ? 1 : 0);
            if (win) lots += `<text x="${CX(i)}" y="${LOTY - 70}" text-anchor="middle" font-size="44" font-weight="800" fill="#b8860b" stroke="#fff" stroke-width="8" paint-order="stroke" transform="translate(0,0)">当たり！</text>`;
          }
        }
        return `<svg width="1350" height="760" style="display:block;font-family:R">${box(675, 130, 10 - drawn)}
          <text x="1000" y="110" text-anchor="middle" font-size="40" font-weight="800" fill="#1c2150">残り</text><text x="1000" y="170" text-anchor="middle" font-size="56" font-weight="800" fill="#1c2150" class="num">${10 - drawn}本</text>
          ${ppl}${lots}<text x="675" y="745" text-anchor="middle" font-size="32" font-weight="800" fill="#5a5f86">1番目 → → → 10番目</text></svg>`;
      }
      // ---- 1万回の点：i回目に当たった人 win1[i]。列の中の順番（rank）を先に計算 ----
      const W1 = R.win1, RANK = new Array(W1.length), seen = new Array(10).fill(0);
      for (let i = 0; i < W1.length; i++) RANK[i] = seen[W1[i]]++;
      const BASE = 650, G0X = 405, G0Y = 50, CELL = 5.4;
      const T10 = (i) => (i < 10 ? K.e10 + i * ST.e10 : K.e100 + ST.e100 * (1 - Math.pow(1 - (i - 10) / 90, 1.6)));
      function legend(g, alphaOf = () => 1) {
        for (let k = 0; k < 10; k++) {
          g.globalAlpha = alphaOf(k); g.fillStyle = COL[k]; g.beginPath(); g.arc(CX(k), BASE + 44, 30, 0, 6.2832); g.fill();
          g.lineWidth = 4; g.strokeStyle = "#1c2150"; g.stroke(); g.fillStyle = "#fff"; g.font = "800 32px R"; g.textAlign = "center"; g.fillText(k + 1, CX(k), BASE + 56);
        }
        g.globalAlpha = 1; g.fillStyle = "#5a5f86"; g.font = "800 26px R"; g.fillText("← 先に引く人　　何番目の人？　　後に引く人 →", 675, BASE + 102);
      }
      function drawSmall(g, t) {           // 10回・100回：当たった人の列に点が積もる
        const D0 = 44;
        g.strokeStyle = "#1c2150"; g.lineWidth = 4; g.beginPath(); g.moveTo(10, BASE); g.lineTo(1340, BASE); g.stroke();
        let n = 0;
        for (let i = 0; i < 100; i++) {
          const t0 = T10(i); if (t < t0) break; n++;
          const k = W1[i], ty = BASE - D0 / 2 - 2 - RANK[i] * D0, p = prog(t, t0, 0.3), y = lerp(20, ty, easeIn(p));
          const sq = p >= 1 ? 1 + 0.25 * Math.max(0, wob(t - t0 - 0.3, 4, 9)) : 1;
          g.fillStyle = COL[k]; g.beginPath(); g.ellipse(CX(k), y + (sq - 1) * 8, 19 * sq, 19 / sq, 0, 0, 6.2832); g.fill();
          g.lineWidth = 3; g.strokeStyle = "rgba(28,33,80,.6)"; g.stroke();
        }
        legend(g);
        return n;
      }
      function gridPos(i) { return [G0X + (i % 100) * CELL, G0Y + Math.floor(i / 100) * CELL]; }
      function colPos(i) { const k = W1[i], r = RANK[i]; return [CX(k) - 27 + (r % 10) * CELL, BASE - CELL - Math.floor(r / 10) * CELL]; }
      function drawBig(g, t, alphaOf = () => 1) {   // 1万回：100×100 → 色ごとに集める
        const shown = Math.round(10000 * easeInOut(prog(t, K.e1m, ST.fill)));
        const sorting = t >= K.sort;
        for (let i = 0; i < 10000; i++) {
          const k = W1[i]; let [x, y] = gridPos(i);
          if (sorting) { const d = 0.9 * (i / 10000), p = easeInOut(prog(t, K.sort + d, ST.sort - 0.9)), [cx, cy] = colPos(i); x = lerp(x, cx, p); y = lerp(y, cy, p) - 120 * Math.sin(Math.PI * p) * (k % 2 ? 1 : 0.6); }
          g.globalAlpha = alphaOf(k);
          g.fillStyle = i < shown ? COL[k] : "rgba(185,189,208,.35)";
          g.fillRect(x, y, 4.6, 4.6);
        }
        g.globalAlpha = 1;
        if (sorting) { g.strokeStyle = "#1c2150"; g.lineWidth = 4; g.globalAlpha = prog(t, K.sort + ST.sort - 0.6, 0.4); g.beginPath(); g.moveTo(10, BASE + 1); g.lineTo(1340, BASE + 1); g.stroke(); g.globalAlpha = 1; }
        return shown;
      }
      function tenLine(g, t, t0, label = "計算の答え 10%") {    // 10%（＝1000回＝100段）の点線
        const y = BASE - 100 * CELL, a = op(t, t0, 0.4); if (a <= 0) return;
        g.globalAlpha = a; g.setLineDash([14, 10]); g.strokeStyle = "#1c2150"; g.lineWidth = 3; g.beginPath(); g.moveTo(10, y); g.lineTo(1340, y); g.stroke(); g.setLineDash([]);
        g.fillStyle = "#1c2150"; g.font = "800 28px R"; g.textAlign = "right"; g.fillText(label, 1340, y - 12); g.globalAlpha = 1;
      }

      function canvasFor(t, sc) {
        const cv = $("cv"), g = cv.getContext("2d"); g.clearRect(0, 0, 1350, 760);
        const v = sc.vis; if (v !== "exp" && v !== "exp1m" && v !== "feel") { cv.style.display = "none"; return; }
        cv.style.display = "block"; g.textAlign = "center";
        if (v === "exp") return drawSmall(g, t);
        if (v === "exp1m") {
          const n = drawBig(g, t);
          if (t >= K.sort + ST.sort - 0.4) legend(g); if (t < K.sort + 0.3) { g.fillStyle = "#5a5f86"; g.font = "800 30px R"; g.textAlign = "center"; g.globalAlpha = op(t, K.e1m) * (1 - op(t, K.sort, 0.3)); g.fillText("たて100 × よこ100 ＝ 1万個の点", 675, G0Y + 590); g.globalAlpha = 1; }
          tenLine(g, t, K.ans);
          return n;
        }
        // feel：1万回の図のまま、列ごとに明るさを変える
        const seenA = (k) => { if (t < K.f_seen) return 1; if (t < K.f_before) return k < 3 ? lerp(1, 0.08, op(t, K.f_seen, 0.5)) : 1;
          if (t < K.f_keep) return k < 3 ? lerp(0.08, 0.9, op(t, K.f_before, 0.5)) : 1; return k === 3 ? 1 : lerp(0.9, 0.3, op(t, K.f_keep, 0.5)); };
        drawBig(g, 1e9, seenA); legend(g, seenA);
        if (t >= K.f_seen) { const top = BASE - CELL * Math.ceil(R.cnt1[3] / 10) - 12;
          g.strokeStyle = "#ffc928"; g.lineWidth = 6; g.strokeRect(CX(3) - 36, top, 72, BASE - top + 6); }
        if (t >= K.f_keep) tenLine(g, t, K.f_keep);
      }
      function overFor(t, sc) {    // キャンバスの上に重ねる文字
        if (sc.vis === "exp1m" && t >= K.ans) return `<div style="position:absolute;left:0;right:0;top:14px;text-align:center;opacity:${op(t, K.ans + 0.5)}" class="note">1万回の結果：${pc1(Math.min(...R.pct1))}〜${pc1(Math.max(...R.pct1))}</div>`;
        if (sc.vis !== "feel") return "";
        let h = "";
        if (t >= K.f_seen && t < K.f_before + 0.4) {   // 上に10本のくじ：1〜3番目は開いてはずれ
          const a = 1 - op(t, K.f_before, 0.4);
          h += `<svg width="1350" height="80" style="position:absolute;left:0;top:0;opacity:${a}">${[...Array(10).keys()].map((k) => lot(CX(k), 40, k < 3 ? "m" : "c", 1, 0.66, k === 3 ? 0.6 + 0.4 * Math.sin(t * 6) : 0)).join("")}</svg>`;
        }
        if (t >= K.f_up - 0.6 && t < K.f_before) h += `<div class="panel" style="position:absolute;left:24px;top:200px;width:300px;padding:22px 16px;text-align:center;transform:scale(${pop(t, K.f_up - 0.6)});box-shadow:0 0 0 6px #ffc928">
            <div style="font-size:30px;font-weight:800">4番目は<br>残り7本から1本</div><div class="num" style="font-size:84px;font-weight:800;white-space:nowrap;opacity:${op(t, K.f_up)}"><span style="font-size:44px">約</span>${pc(R.cond4)}</div>
            <div style="font-size:22px;font-weight:700;color:#5a5f86;opacity:${op(t, K.f_up + 0.5)}">計算の答え 7分の1＝${pc1(R.theory_cond4)}</div>
            <div style="position:absolute;right:-60px;top:150px;font-size:60px">→</div></div>`;
        if (t >= K.f_before) h += `<div style="position:absolute;left:0;width:300px;text-align:center;opacity:${op(t, K.f_before) * (1 - op(t, K.f_keep, 0.4))};font-size:26px;font-weight:800;color:#1c2150;line-height:1.2;background:#fff;border:4px solid #1c2150;border-radius:14px;margin-left:8px;width:290px;padding:2px 0;top:6px">1〜3番目で<br>先に当たりが出た回</div>`;
        return h;
      }

      // ---- 理由の図：かけ算 ----
      function frac(n, d, xn = false, xd = false) { return `<span class="fr num"><b class="${xn ? "x" : ""}">${n}</b><i></i><b class="${xd ? "x" : ""}">${d}</b></span>`; }
      const chipM = (s) => `<span class="chip" style="background:#b9bdd0">${s}</span>`, chipH = (s) => `<span class="chip" style="background:#ffc928">${s}</span>`;
      function piece(t, t0, chip, fr) { return `<span class="pc" style="opacity:${op(t, t0)};transform:translateY(${(1 - easeOut(prog(t, t0, .35))) * 30}px)">${chip}${fr}</span>`; }
      function eq(t, t0) { return `<span class="op" style="opacity:${op(t, t0)}">＝</span><span class="pc" style="opacity:${op(t, t0)};transform:scale(${t >= t0 ? pop(t, t0) : 0})"><span class="chip" style="background:#1c2150;color:#fff">どれも</span><span style="background:#ffc928;border-radius:18px;padding:8px 14px;display:inline-block">${frac(1, 10)}</span></span>`; }
      const mini = (i) => `<svg width="80" height="150" style="flex:none">${person(i, 40, 146, 0.95)}</svg>`;
      function whyHTML(t) {
        const s2 = t >= K.w2c + 0.3, s3 = t >= K.w3c + 0.4;
        const r1 = `<div class="wrow" style="opacity:${op(t, K.w1)}">${mini(0)}${piece(t, K.w1, chipH("1番目 当たり"), frac(1, 10))}${eq(t, K.w1 + 0.6)}</div>`;
        const r2 = `<div class="wrow" style="opacity:${op(t, K.w2a)}">${mini(1)}${piece(t, K.w2a, chipM("1番目 はずれ"), frac(9, 10, s2))}<span class="op" style="opacity:${op(t, K.w2b)}">×</span>${piece(t, K.w2b, chipH("2番目 当たり"), frac(1, 9, false, s2))}${eq(t, K.w2eq)}</div>`;
        const r3 = `<div class="wrow" style="opacity:${op(t, K.w3)}">${mini(2)}${piece(t, K.w3, chipM("1番目 はずれ"), frac(9, 10, s3))}<span class="op" style="opacity:${op(t, K.w3 + .3)}">×</span>${piece(t, K.w3 + .3, chipM("2番目 はずれ"), frac(8, 9, s3, s3))}<span class="op" style="opacity:${op(t, K.w3 + .6)}">×</span>${piece(t, K.w3 + .6, chipH("3番目 当たり"), frac(1, 8, false, s3))}${eq(t, K.w3eq)}</div>`;
        return `<div class="panel" style="padding:20px 30px">${r1}${r2}${r3}<div class="note" style="opacity:${op(t, K.w2c)}">かけると、上と下の同じ数が消える</div></div>`;
      }
      // ---- 配ってから一斉に開ける ----
      function dealSVG(t) {
        let ppl = "", lots = "";
        for (let i = 0; i < 10; i++) {
          ppl += person(i, CX(i), FEET, 1);
          const t0 = K.dl_give + i * 0.07; if (t < t0) continue;
          const p = easeOut(prog(t, t0, 0.5)), x = lerp(675, CX(i), p), y = lerp(120, LOTY, p) - 80 * Math.sin(Math.PI * p);
          const q = prog(t, K.dl_open + 0.15, 0.2), back = prog(t, K.dl_same - 0.3, 0.2);
          const openNow = q > 0.5 && back < 0.5, sx = Math.max(0.05, Math.abs(Math.cos(Math.PI * q)) * (back > 0 ? Math.abs(Math.cos(Math.PI * back)) : 1));
          const hit = ORDER[i] === 0;
          // 開け直したあと：当たりがどこにあってもおかしくない（光が10人を順に回る）
          const cyc = t >= K.dl_same ? Math.floor((t - K.dl_same) / 0.22) % 10 : -1;
          lots += lot(x, y, openNow ? (hit ? "h" : "m") : "c", sx, 1, (openNow && hit) ? 1 : cyc === i ? 0.9 : 0);
          if (t >= K.dl_same) lots += `<g opacity="${op(t, K.dl_same + i * 0.05)}" transform="translate(${CX(i)},${LOTY - 92})"><text x="0" y="-22" text-anchor="middle" font-size="26" font-weight="800" fill="#1c2150">1</text><rect x="-20" y="-16" width="40" height="5" fill="#1c2150"/><text x="0" y="16" text-anchor="middle" font-size="26" font-weight="800" fill="#1c2150">10</text></g>`;
        }
        return `<svg width="1350" height="760" style="display:block;font-family:R">${box(675, 130, t < K.dl_give ? 10 : 0)}${ppl}${lots}
          <text x="675" y="745" text-anchor="middle" font-size="34" font-weight="800" fill="#1c2150" opacity="${op(t, K.dl_open)}">${t < K.dl_same ? "せーので、一斉に開ける" : "当たりがだれの手にあるかは、10人とも同じ"}</text></svg>`;
      }
      // ---- 当たり3本の棒 ----
      function threeHTML(t) {
        const B = 500, H = (p) => p / 0.4 * 420, P = D.R.pct3;
        const bars = P.map((p, k) => { const g = easeOut(prog(t, K.th_go + k * 0.08, 0.7)), h = H(p) * g;
          return `<rect x="${CX(k) - 34}" y="${B - h}" width="68" height="${h}" rx="10" fill="${COL[k]}" stroke="#1c2150" stroke-width="3"/>
            <circle cx="${CX(k)}" cy="${B + 46}" r="30" fill="${COL[k]}" stroke="#1c2150" stroke-width="4"/><text x="${CX(k)}" y="${B + 58}" text-anchor="middle" font-size="32" font-weight="800" fill="#fff">${k + 1}</text>`; }).join("");
        const ly = B - H(0.3);
        return `<div class="panel" style="padding:24px 0 10px"><div class="ph">当たり3本・10人のくじ引きを1万回</div><svg width="1350" height="620" style="display:block;font-family:R">
          <g><line x1="10" x2="1340" y1="${B}" y2="${B}" stroke="#1c2150" stroke-width="4"/>${bars}
          <g opacity="${op(t, K.th_num)}"><line x1="10" x2="1340" y1="${ly}" y2="${ly}" stroke="#1c2150" stroke-width="3" stroke-dasharray="14 10"/><text x="1340" y="${ly - 14}" text-anchor="end" font-size="28" font-weight="800" fill="#1c2150">計算の答え 30%</text></g></g>
          <text x="675" y="${B + 112}" text-anchor="middle" font-size="30" font-weight="800" fill="#5a5f86" opacity="${op(t, K.th_num + 0.6)}">1万回の結果：${pc1(Math.min(...P))}〜${pc1(Math.max(...P))}</text></svg></div>`;
      }

      function stage(t, sc) {
        const v = sc.vis;
        if (v === "hook") {
          const tag = (x, txt, col, t0) => `<g opacity="${op(t, t0)}" transform="translate(${x},${LOTY - 20}) scale(${t >= t0 ? pop(t, t0) : 0})"><rect x="-110" y="-46" width="220" height="80" rx="40" fill="${col}" stroke="#fff" stroke-width="5"/><text x="0" y="12" text-anchor="middle" font-size="38" font-weight="800" fill="#fff">${txt}</text></g>`;
          let ppl = ""; for (let i = 0; i < 10; i++) ppl += person(i, CX(i), FEET, 1, -8 * Math.max(0, Math.sin(t * 5 - i * 0.6)));
          return { title: `くじ引きは<br><span style="color:var(--gold)">先に引いた人が得？</span>`,
            html: `<svg width="1350" height="760" style="display:block;font-family:R">${box(675, 130, 10)}${ppl}${tag(CX(0) + 70, "先に引く", "#e03131", 0.6)}${tag(CX(9) - 70, "残り物", "#1971c2", K.h_q)}
              <g opacity="${op(t, K.h_n)}" transform="translate(675,330) scale(${t >= K.h_n ? pop(t, K.h_n) : 0}) rotate(-4)"><rect x="-230" y="-62" width="460" height="110" rx="26" fill="#ffd84a" stroke="#1c2150" stroke-width="6"/><text x="0" y="18" text-anchor="middle" font-size="60" font-weight="800" fill="#1c2150">1万回 ためす</text></g></svg>` };
        }
        if (v === "rule") {
          const cards = [...Array(10).keys()].map((i) => { const t0 = K.r_ten + i * 0.08, hit = i === 0, b = hit && t >= K.r_one ? 1 + 0.15 * Math.max(0, wob(t - K.r_one, 3, 4)) : 1;
            return `<div style="width:112px;height:140px;border-radius:18px;border:5px solid #1c2150;background:${hit ? "#ffc928" : "#b9bdd0"};display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#1c2150;transform:scale(${(t >= t0 ? pop(t, t0) : 0) * b});box-shadow:${hit && t >= K.r_one ? "0 0 0 10px rgba(255,216,74,.6)" : "none"}"><span style="font-size:54px">${hit ? "★" : "×"}</span>${hit ? "当たり" : "はずれ"}</div>`; }).join("");
          const rows = [["10人が順番に1本ずつ引く", "1", K.r_order], ["引いたくじは戻さない", "2", K.r_back], ["ズルなし", "3", K.r_fair], ["結果を見る前に考える", "4", K.r_before]];
          return { title: `今回の<span style="color:var(--gold)">ルール</span>`, html: `<div style="display:grid;grid-template-columns:repeat(10,112px);gap:14px;justify-content:center;margin-bottom:34px">${cards}</div>
            <div class="panel" style="padding:6px 38px">${rows.map(([a, n, t0]) => `<div class="cond" style="opacity:${op(t, t0)};transform:translateX(${(1 - easeOut(prog(t, t0, .35))) * 60}px)"><i>${n}</i><span>${a}</span></div>`).join("")}</div>` };
        }
        if (v === "demo") return { title: `まずは<span style="color:var(--gold)">1回</span>やってみる`, html: `<div class="panel" style="padding:0;height:760px;overflow:hidden">${demoSVG(t)}</div>` };
        if (v === "guess") {
          const ch = [["先に引く人が得", "#e03131", K.g_a, "A"], ["後の人が得", "#1971c2", K.g_b, "B"], ["どの順番も同じ", "#1c2150", K.g_c, "C"]];
          return { title: `何回もやったら<br><span style="color:var(--gold)">どうなる？</span>`, html: `<div style="display:flex;flex-direction:column;gap:46px;margin-top:40px">${ch.map(([l, c, t0, a], i) =>
            `<div class="panel" style="display:flex;align-items:center;gap:30px;padding:30px 44px;box-shadow:0 0 0 8px ${c},0 16px 0 rgba(0,0,0,.25);transform:scale(${t >= t0 ? pop(t, t0) : 0}) rotate(${[-2, 2, -1][i]}deg)">
              <span style="display:inline-flex;width:110px;height:110px;border-radius:50%;background:${c};color:#fff;font-size:64px;font-weight:800;align-items:center;justify-content:center">${a}</span><span style="font-size:66px;font-weight:800">${l}</span></div>`).join("")}</div>` };
        }
        if (v === "exp" || v === "exp1m" || v === "feel") {
          let title;
          if (v === "exp") { let n = 0; for (let i = 0; i < 100; i++) if (t >= T10(i)) n++; title = `<span class="num" style="color:var(--gold)">${n}回</span>やってみた<br><span style="font-size:44px;margin-left:28px">点の色＝当たった人</span>`; }
          else if (v === "exp1m") title = t >= K.ans ? `<div>${hz(t, K.ans, "どれも約10%", 88)}</div>` : t >= K.sort ? `色ごとに<span style="color:var(--gold)">集めると…</span>` : `<span class="num" style="color:var(--gold)">${t < K.e1m ? "1万回" : Math.round(10000 * easeInOut(prog(t, K.e1m, ST.fill))).toLocaleString() + "回"}</span><br><span style="font-size:44px;margin-left:28px">1回＝1つの点</span>`;
          else title = t >= K.f_keep ? `<span style="font-size:54px">引く前に考えると </span><br>${hz(t, K.f_keep, "10%のまま", 84)}` : t >= K.f_before ? `でも<span style="color:var(--gold)">引く前</span>は…` : t >= K.f_seen ? `3人の外れを<br><span style="color:var(--gold)">見た後</span>なら？` : `前の人が外れたら<br><span style="color:var(--gold)">後の人が有利？</span>`;
          return { title, html: `<div class="panel" style="height:760px"></div>` };
        }
        if (v === "why") return { title: `なぜ<span style="color:var(--gold)">同じ</span>になる？`, html: whyHTML(t) };
        if (v === "deal") return { title: t < K.dl_same ? `配ってから<br><span style="color:var(--gold)">一斉に開ける</span>のと同じ` : `どの人も<br><span style="color:var(--gold)">10分の1</span>`, html: `<div class="panel" style="padding:0;height:760px;overflow:hidden">${dealSVG(t)}</div>` };
        if (v === "three") return { title: t >= K.th_num ? `<span style="font-size:54px">当たり3本でも </span><br>${hz(t, K.th_num, "どれも約30%", 84)}` : `当たりが<span style="color:var(--gold)">3本</span>なら？`, html: threeHTML(t) };
        if (v === "sum") {
          const say = (txt, t0, i) => `<div style="display:flex;align-items:center;justify-content:center;gap:20px;margin:16px 0;opacity:${op(t, t0)}"><span style="font-size:50px;font-weight:800">「${txt}」</span>
            <span style="display:inline-block;font-size:36px;font-weight:800;color:#fff;background:#1c2150;border-radius:14px;padding:6px 16px;transform:rotate(${i ? 6 : -6}deg) scale(${t >= K.s2c ? pop(t, K.s2c + i * 0.25) : 0})">気のせい</span></div>`;
          return { title: `<span style="color:var(--gold)">答え</span>`, html: `<div class="panel" style="text-align:center"><div style="font-size:34px;font-weight:700;color:#5a5f86;opacity:${op(t, K.s1)}">戻さない・ズルなしのくじなら</div>
            <div style="font-size:54px;font-weight:800;margin:14px 0;opacity:${op(t, K.s1b)}">先に引いても、後に引いても</div><div style="min-height:140px">${t >= K.s1b + 1.0 ? hz(t, K.s1b + 1.0, "当たる確率は同じ", 84) : ""}</div></div>
            <div class="panel" style="margin-top:36px;opacity:${op(t, K.s2a)}"><div class="note" style="margin:0 0 6px">当たる確率については…</div>${say("残り物には福がある", K.s2a, 0)}${say("早い者勝ち", K.s2b, 1)}</div>` };
        }
        return { title: `<span style="color:var(--gold)">まとめ</span>`, html: `<div class="panel" style="margin-top:90px;text-align:center;opacity:${op(t, K.e_sum)}">
          <div style="font-size:34px;font-weight:700;color:#5a5f86">戻さないくじなら</div><div style="font-size:62px;font-weight:800;margin-top:8px">順番は<span style="color:#d9480f">気にしなくて大丈夫</span></div></div>
          <div class="panel" style="margin-top:40px;text-align:center;opacity:${op(t, K.e_cm)};transform:scale(${t >= K.e_cm ? pop(t, K.e_cm) : 0})"><div style="font-size:44px;font-weight:800;color:#5a5f86">次に確かめてほしい言い伝えは？</div><div style="font-size:64px;font-weight:800;margin-top:10px">コメントで<span style="color:#d9480f">教えてね！</span></div></div>` };
      }

      // ---- アリス ----
      const NAMES = ["base", "talk", "talk_half", "blink", "happy", "surprised", "troubled", "pose_thinking", "pose_thinking_talk", "pose_thinking_half", "pose_pointing", "pose_pointing_talk", "pose_pointing_half", "pose_excited", "pose_excited_talk"];
      $("alice").innerHTML = NAMES.map((n) => `<img id="a_${n}" src="assets/alice/${n}_768.png" alt="${n === "base" ? "電脳アリス" : ""}" style="opacity:0">`).join("");
      const AMT = { surprised: 1.0, pose_excited: 0.8, troubled: 0.5 }, MARK = { surprised: "！", pose_thinking: "？", troubled: "💦", pose_excited: "✨" };
      function alice(t, sc, u) {
        const f = Math.floor(t * D.fps), mo = D.mouth[Math.min(f, D.mouth.length - 1)] || 0, face = sc.face || "base";
        const half = { base: "talk_half", pose_thinking: "pose_thinking_half", pose_pointing: "pose_pointing_half", pose_excited: "pose_excited" };
        const f0 = face.startsWith("pose_") ? face : (mo ? "base" : face);
        const show = mo === 2 ? (f0 === "base" ? "talk" : f0 + "_talk") : mo === 1 ? half[f0] : (f0 === "base" && t % 3.4 < 0.12 ? "blink" : f0);
        for (const n of NAMES) $("a_" + n).style.opacity = n === show ? 1 : 0;
        const prev = D.scenes[D.scenes.indexOf(sc) - 1], changed = !prev || prev.face !== sc.face;
        const nx = D.scenes[D.scenes.indexOf(sc) + 1], pre = nx && nx.face !== sc.face ? faceAct(t, nx.start, 0) : { sx: 1, sy: 1 };
        const act = changed ? faceAct(t, sc.start, AMT[face] ?? 0.3) : { sx: 1, sy: 1 };
        const en = easeOut(prog(t, 0.2, 0.7)), lean = face === "pose_pointing" ? 2 : 0;
        $("alice").style.transform = `translate(${-(1 - en) * 600 + (lean ? 16 : 0)}px, ${Math.sin(t * 2.2) * 6 + Math.sin(t * 3.7) * 2 + (mo ? -3 : 0)}px) rotate(${Math.sin(t * 1.3) * 0.8 + lean}deg) scale(${act.sx * pre.sx},${act.sy * pre.sy})`;
        const mk = changed && MARK[face] && u < 1.2 ? MARK[face] : "";
        $("mark").innerHTML = mk; $("mark").style.transform = mk ? `scale(${backOut(prog(t, sc.start, .35))}) rotate(${Math.sin(t * 9) * 6}deg)` : ""; $("mark").style.opacity = mk ? 1 - prog(t, sc.start + 0.9, 0.3) : 0;
      }
      function caption(sc, u, t) {
        if (u > sc.voice_len + 0.3) return "";
        const parts = sc.sub.match(/[^。？！…]+[。？！…]*/g) || [sc.sub]; let k = 0;
        for (let i = 0; i < sc.marks.length; i++) if (t >= sc.marks[i][1] - 0.05) k = i;
        let line = (parts[k] || "").replace(/。$/, "");
        if (line.length > 26) { const m = line.length / 2; let b = -1; for (let i = 0; i < line.length - 1; i++) if ("、".includes(line[i]) && (b < 0 || Math.abs(i - m) < Math.abs(b - m))) b = i; if (b < 0) b = Math.floor(m); line = line.slice(0, b + 1) + "\n" + line.slice(b + 1); }
        return line;
      }
      // ---- 背景の色の流れ・カメラ・場面転換 ----
      const BG = { hook: "#2d3577", rule: "#2d3577", demo: "#24508f", guess: "#2d3577", exp: "#24508f", exp1m: "#3a2f7a", why: "#2b4a7a", deal: "#2b4a7a", feel: "#4a2f7a", three: "#5a4a1f", sum: "#6a5a1f", end: "#2d3577" };
      function bgAt(t, sc) { const i = D.scenes.indexOf(sc), prev = D.scenes[i - 1]; const a = prev ? BG[prev.vis] : BG[sc.vis], b = BG[sc.vis], k = prog(t, sc.start, 1.0);
        const mix = (x, y) => { const p = (h) => [1, 3, 5].map((j) => parseInt(h.slice(j, j + 2), 16)); const A = p(x), B = p(y); return `rgb(${A.map((v, j) => Math.round(lerp(v, B[j], k))).join(",")})`; };
        return `radial-gradient(ellipse at 50% 30%, ${mix(a, b)} 0%, #171b42 62%, #0e1130 100%)`; }
      const WCOL = ["#ffc928", "#4da3ff", "#ff6b6b", "#3ccf7a"], TR = 0.3;
      function wipe(t) {
        const j = VB.findIndex((b) => Math.abs(t - b) < TR && !NOWIPE.has(b)), w = $("wipe");
        if (j < 0) { w.innerHTML = ""; return; }
        const p = (t - (VB[j] - TR)) / (2 * TR), dir = j % 2 ? -1 : 1;
        w.innerHTML = [0, 0.14, 0.06, 0.18, 0.1].map((d, i) => { const q = p < 0.5 ? easeOut(clamp((p * 2 - d) / (1 - d))) : easeIn(clamp(((p - 0.5) * 2 - d) / (1 - d)));
          const x0 = p < 0.5 ? 0 : q, x1 = p < 0.5 ? q : 1;
          return `<div style="position:absolute;top:${i * 20}%;height:21%;left:${(dir > 0 ? x0 : 1 - x1) * 100}%;width:${(x1 - x0) * 100}%;background:${WCOL[(j + i) % 4]};transform:skewY(-6deg)"></div>`; }).join("");
      }
      function renderAt(t) {
        let sc = D.scenes[0]; for (const s of D.scenes) if (t >= s.start) sc = s;
        // 帯で覆いきるまでは前の場面の絵を残す
        const u = t - sc.start, first = firstOf(sc.vis);
        $("bg").style.background = bgAt(t, sc);
        $("dots").style.backgroundPosition = `0 ${(t * 12) % 48}px`;
        const r = stage(t, sc);
        $("stage").innerHTML = r.html; $("title").innerHTML = r.title;
        canvasFor(t, sc); $("over").innerHTML = overFor(t, sc);
        $("title").style.transform = `scale(${0.7 + 0.3 * backOut(prog(t, first.start, 0.5))})`;
        const z = 1 + 0.004 * Math.min(t - first.start, 6), hit = HITS.find((h) => t >= h && t < h + 0.35);
        const [sx, sy] = hit ? shakeXY(t, 10 * (1 - (t - hit) / 0.35)) : [0, 0], bump = HITS.reduce((s, h) => s + spring(t, h, 7, 22), 0) * 0.008;
        $("cam").style.transform = `translate(${sx + 4 * Math.sin(t * 0.5)}px,${sy}px) scale(${z + bump})`;
        $("cap").textContent = t < D.lead ? "" : caption(sc, u, t);
        alice(t, sc, u); wipe(t);
        $("qcard").innerHTML = sc.vis === "hook" ? "" : `<div style="font-size:28px;color:var(--gold)">確率のお話③</div>くじ引きは<br>先に引いた人が得？`;
        $("flash").style.opacity = hit ? 0.25 * (1 - (t - hit) / 0.35) : 0;
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      document.fonts.ready.then(() => renderAt(0));
      renderAt(0);
    </script>
  </body>
</html>
