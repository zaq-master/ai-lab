    <script>
      const D = window.DATA, K = D.K, T = D.txt, E1 = D.e1, E2 = D.e2, E3 = D.e3, E4 = D.e4, E5 = D.e5;
      const { clamp, lerp, prog, easeOut, easeIn, smooth, backOut, spring, springTo, wob, shakeXY, roll, faceAct, hash, flyEase, kf } = window.M;

      const SC = Object.fromEntries(D.scenes.map((s) => [s.id, s]));

      const HARD = (v) => /^c\dt$|^sum|^end$/.test(v);
      const VB = D.scenes.filter((s, i) => i && s.vis !== D.scenes[i - 1].vis && (HARD(s.vis) || HARD(D.scenes[i - 1].vis))).map((s) => s.start);
      const g = $("cv").getContext("2d");
      const A = (x, y, w, h, inner, st = "") => `<div class="abs" style="left:${x}px;top:${y}px;${w != null ? `width:${w}px;` : ""}${h != null ? `height:${h}px;` : ""}${st}">${inner}</div>`;
      const ball = (s, col, st = "") => `<span class="ball" style="width:${s}px;height:${s}px;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.75) 0 9%,transparent 10%),${col};box-shadow:inset 0 -${s * 0.08}px 0 rgba(0,0,0,.18)${col === GOLD ? `,0 0 0 ${Math.max(2, s * 0.04)}px #8a5a00` : ""};${st}"></span>`;

          <rect x="68" y="246" width="64" height="24" rx="8" fill="#2a2340"/><rect x="14" y="276" width="172" height="18" rx="9" fill="#5f3dc4" stroke="#fff" stroke-width="4"/></svg>`;
      }
      // ---- 点をまとめて描く（色ごとに1回で塗る） ----
      function circles(list, r) { // list: {色: [x,y,...]}
        for (const col in list) { const a = list[col]; g.fillStyle = col; g.beginPath(); for (let i = 0; i < a.length; i += 2) { g.moveTo(a[i] + r, a[i + 1]); g.arc(a[i], a[i + 1], r, 0, 6.2832); } g.fill(); }
      }
      const GX = 40, GY = 20, GS = 700;       // 1万人の点（100×100）の場所

      const trialAt = (i) => { const r = Math.floor(i / 100), c = i % 100; return (Math.floor(r / 10) * 10 + Math.floor(c / 10)) * 100 + (r % 10) * 10 + (c % 10); };
      function grid(colorOf, z = 1, block = false) {
        g.save(); g.beginPath(); g.rect(GX - 4, GY - 4, GS + 8, GS + 8); g.clip();
        const cell = GS * z / 100, r = Math.max(1.2, cell * 0.41), lim = Math.min(100, Math.ceil(100 / z) + 1), L = {};

      }

      const bigNum = (txt, size, col = "#fff", s = 1) => `<div class="big num" style="font-size:${size}px;line-height:1.05;color:${col};transform:scale(${s});-webkit-text-stroke:10px #0e1130;text-shadow:none;white-space:nowrap">${txt}</div>`;
      const steps = (t, cur, t0) => A(790, 0, 640, 70, `<div style="display:flex;justify-content:center;align-items:center;gap:10px;height:70px">${["1人", "10人", "100人", "1万人"].map((l, i) =>
        `<div style="font-size:${i === cur ? 44 : 32}px;padding:0 20px;border-radius:30px;line-height:60px;white-space:nowrap;background:${i === cur ? "#fff" : "transparent"};color:${i === cur ? "#1c2150" : i < cur ? "rgba(255,255,255,.75)" : "rgba(255,255,255,.35)"};transform:scale(${i === cur ? Math.max(0.6, pop(t, t0)) : 1})">${l}</div>${i < 3 ? '<div style="color:rgba(255,255,255,.4);font-size:30px">→</div>' : ""}`).join("")}</div>`);

      // ---- 実験②の並べ直し（当たった回数ごとに積む） ----
      const HX0 = 20, HB = 640, PXD = 1.36, CW = 2.72;
      const X2 = E2.x, N = X2.length, hx = new Float32Array(N), hy = new Float32Array(N), wx = new Float32Array(N), wy = new Float32Array(N);
      (function () { const cnt = {}; let w = 0;
        for (let i = 0; i < N; i++) { const b = Math.floor((X2[i] - 1) / 2), k = (cnt[b] = (cnt[b] || 0) + 1) - 1; hx[i] = HX0 + b * CW; hy[i] = HB - (k + 1) * CW;
          if (X2[i] > E4.cap) { wx[i] = HX0 + E4.cap * PXD + 6 + (w % 14) * CW; wy[i] = HB - (Math.floor(w / 14) + 1) * CW; w++; } else { wx[i] = hx[i]; wy[i] = hy[i]; } } })();
      const iMax = X2.indexOf(E2.max);
      const hxAt = (d) => HX0 + d * PXD;
      function histDots(k, wall = 0, wcol = "#4da3ff") {   // k: 0=点の表 → 1=積んだ図
        g.fillStyle = GOLD; const cell = GS / 100; let late = [];
        for (let i = 0; i < N; i++) {
          const kk = k >= 1 ? 1 : flyEase(clamp(k * 1.35 - 0.35 * hash(i, 3)));
          let x = lerp(GX + (i % 100 + 0.2) * cell, hx[i], kk), y = lerp(GY + (Math.floor(i / 100) + 0.2) * cell, hy[i], kk), s = lerp(cell * 0.7, CW - 0.6, kk);
          if (wall > 0 && X2[i] > E4.cap) { const ww = flyEase(clamp(wall * 1.3 - 0.3 * hash(i, 5))); x = lerp(hx[i], wx[i], ww); y = lerp(hy[i], wy[i], ww) - 60 * Math.sin(Math.PI * ww); late.push(x, y); continue; }

      }
      function axis2(dim = 0) {

        for (let d = 0; d <= 1000; d += 100) h += A(hxAt(d) - 60, HB + 12, 120, 40, d === 0 ? "0" : d + "回", `text-align:center;font-size:28px;color:rgba(255,255,255,${dim && d > 200 ? 0.3 : 0.85})`) + A(hxAt(d) - 1.5, HB - 6, 3, 14, "", "background:rgba(255,255,255,.8)");

      }
      const vline = (x, y0, col, o = 1, w = 6) => A(x - w / 2, y0, w, HB - y0, "", `background:${col};border-radius:3px;opacity:${o}`);
      // ---- 実験⑤の積んだ図 ----
      const T5 = E5.t, X5 = 100, P5 = 26, C5 = 4, h5x = new Float32Array(N), h5y = new Float32Array(N);
      (function () { const cnt = {}; for (let i = 0; i < N; i++) { const v = T5[i], k = (cnt[v] = (cnt[v] || 0) + 1) - 1; h5x[i] = X5 + (v - 6) * P5 + (k % 6) * C5; h5y[i] = HB - (Math.floor(k / 6) + 1) * C5; } })();
      const x5 = (v) => X5 + (v - 6) * P5 + 12;
      const KC = ["#ff6b6b", "#ffa94d", "#69db7c", "#4dabf7", "#b197fc", "#f783ac"];
      const kball = (i, s, on = true) => `<span class="ball" style="width:${s}px;height:${s}px;line-height:${s}px;text-align:center;font-size:${s * 0.5}px;color:${on ? "#1c2150" : "rgba(255,255,255,.35)"};background:${on ? `radial-gradient(circle at 34% 28%,rgba(255,255,255,.7) 0 9%,transparent 10%),${KC[i]}` : "rgba(255,255,255,.06)"};box-shadow:${on ? "inset 0 -5px 0 rgba(0,0,0,.18)" : "inset 0 0 0 4px rgba(255,255,255,.35)"}">${i + 1}</span>`;

      // 10人の棒（実験②・⑤共通）
      function tenBars(t, data, go, end, ta, tb, tick, unit) {

            A(150, y + 9, len, 32, "", `background:${GRAY};border-radius:16px;opacity:${dimd}`) +
            (done ? A(150 + len - 22, y + 3, 44, 44, ball(44, GOLD), `transform:scale(${Math.max(0.3, pop(t, go + (end - go) * v / mx, 0.3))});opacity:${dimd}`) +
              A(150 + len + 34, y, 200, 50, `<span class="num" style="font-size:${hl ? 46 : 34}px;color:${hl ? GOLD : "#fff"}">${v}${unit}</span>`, `line-height:50px;white-space:nowrap;opacity:${dimd}`) : ""); });
        const yb = 24 + 10 * 62 + 4; h += A(150, yb, 1120, 3, "", "background:rgba(255,255,255,.6)");
        for (let d = 0; d <= mx * 1.08; d += tick) h += A(150 + d * sc - 50, yb + 8, 100, 36, d + unit, "text-align:center;font-size:26px;color:rgba(255,255,255,.8)");

      }
      const CHT = { c1t: ["実験①", "100回引いたら、<br>当たる？"], c2t: ["実験②", "じゃあ、何回引けば<br>安心？"], c3t: ["実験③", "200回外れた。<br>そろそろ出る？"], c4t: ["実験④", "天井があると、<br>どうなる？"], c5t: ["実験⑤", "全6種類、そろえるには<br>何回？"] };
      const CHS = ["① 100回で当たる？", "② 何回引けば安心？", "③ そろそろ出る？", "④ 天井があると？", "⑤ 6種類そろえる"];
      const g2n = (t) => Math.floor(kf(t, [[K.g2_go, 0], [SC.halfq.start, 28], [K.h_sil, E2.half.sim], [K.p90_go, E2.half.sim], [K.p90, E2.p90.sim], [K.p99_go, E2.p90.sim], [K.p99, E2.p99.sim], [K.m_go, E2.p99.sim], [K.m_sil, E2.max]], (x) => x));
      let memoN = -1, memoC = 0;
      const hitBy = (n) => { if (n !== memoN) { let c = 0; for (let i = 0; i < N; i++) c += X2[i] <= n; memoN = n; memoC = c; } return memoC; };

      function stage(t, sc) {
        const v = sc.vis, id = sc.id;
        g.clearRect(0, 0, 1440, 740);
        if (v === "hook") {

            A(520, 20, 900, 200, `<span class="big" style="font-size:150px;white-space:nowrap">確率<span class="g" style="font-size:190px">1%</span></span>`, `transform:scale(${Math.max(0.5, pop(t, 0.1))});transform-origin:0 50%`) +
            A(520, 235, 900, 180, `<span class="big" style="font-size:140px;white-space:nowrap">× 100回引く</span>`, `opacity:${op(t, K.h_q)};transform:scale(${pop(t, K.h_q)});transform-origin:0 50%`) +
            A(520, 420, 900, 200, `<span class="big" style="font-size:150px;white-space:nowrap">＝ 当たる<span class="g" style="display:inline-block;transform:scale(${1 + 0.08 * Math.sin(t * 6)})">？</span></span>`, `opacity:${op(t, K.h_q + 0.7)};transform:scale(${pop(t, K.h_q + 0.7)});transform-origin:0 50%`) +

              A(x0 + i * pitch, 400 + s + 10, pitch, 44, dup ? `<span style="color:#ff8a80">ダブり</span>` : `<span style="color:#b9f6ca">新しい！</span>`, `text-align:center;font-size:${Math.min(32, pitch * 0.2)}px;white-space:nowrap`) +
              A(x0 + i * pitch, 352, pitch, 40, `${i + 1}回目`, "text-align:center;font-size:28px;color:rgba(255,255,255,.75)"); });
          for (let i = 0; i < 6; i++) { const on = !run || i in got, t0 = run ? got[i] ?? 0 : K.k1a + i * 0.1; h += A(170 + i * 190, 60, 150, 150, kball(i, 150, on), `transform:scale(${run ? (on ? 1 + 0.35 * Math.max(0, wob(t - t0, 3, 6)) : 1) : pop(t, t0)})`); }
          h += A(120, 30, 1200, 210, "", "border:5px dashed rgba(255,255,255,.4);border-radius:30px") + A(0, 250, 1440, 60, run ? `そろった種類 <span class="num g" style="font-size:54px">${Object.keys(got).length}</span> / 6　　引いた回数 <span class="num" style="font-size:54px">${cnt}</span>回` : t >= K.k1b ? `<span style="opacity:${op(t, K.k1b)}">毎回、どれか1つが出る（どれも同じ確率）</span>` : "", "text-align:center;font-size:40px;white-space:nowrap");
          if (t >= K.k3) h += A(0, 590, 1440, 150, `<div class="c">${hz(t, K.k3, `${E5.first}回でそろった！`, 100)}</div>`);
          return { title: run ? `<span class="g">6回</span>で全部そろう？（1人目）` : `全部で<span class="g">6種類</span>のガチャ`, html: h };
        }
        if (v === "e5ten") return { title: `<span class="g">10人</span>が全部そろうまで引く`, html: A(60, 0, 1380, 740, tenBars(t, E5.ten, K.k10_go, K.k10_end, K.k10a, K.k10b, 5, "回")) };
        if (v === "e5hist") {
          const n = Math.round(N * Math.pow(prog(t, K.k1m_go, K.k1m_end - K.k1m_go), 1.6)); g.fillStyle = GOLD;
          for (let i = 0; i < n; i++) g.fillRect(h5x[i], h5y[i], C5 - 0.8, C5 - 0.8);
          let h = A(X5 - 10, HB + 2, (E5.max - 5) * P5 + 20, 4, "", "background:rgba(255,255,255,.8)");
          for (const d of [6, 10, 20, 30, 40, 50]) if (d <= E5.max) h += A(x5(d) - 50, HB + 12, 100, 40, d + "回", "text-align:center;font-size:28px;color:rgba(255,255,255,.85)");
          h += A(940, HB + 52, 500, 40, "全部そろった回数 →", "text-align:right;font-size:26px;color:rgba(255,255,255,.7)");
          const q = t >= SC.kq.start, ans = t >= K.ka;
          if (!q) h += A(700, 120, 700, 200, `<div class="lbl">積んだ人数</div>${bigNum(n.toLocaleString() + `<span style="font-size:60px">人</span>`, 130)}`);

            A(760, 330, 660, 40, `計算の答え ${E5.mean_theory}回`, `font-size:28px;color:rgba(255,255,255,.75);opacity:${op(t, K.ka + 1.0)}`);
            if (ans) h += vline(x5(E5.mean), 30, "#4da3ff", op(t, K.ka)) + A(x5(E5.mean) + 10, 30, 120, 50, `<span class="tag" style="background:#1971c2;font-size:30px">平均</span>`, `opacity:${op(t, K.ka)}`); }
          if (t >= K.ka2 && id !== "k90") h += A(x5(6) - 3, 76, 6, HB - 76 - (E5.min_count / 6) * C5 - 16, "", "background:#fff;border-radius:3px") + A(20, 0, 560, 76, `<div class="panel" style="padding:6px 20px;font-size:38px;white-space:nowrap;display:inline-block">6回ぴったり <span class="num" style="color:#d9480f;font-size:52px">${E5.min_count}人</span>だけ</div>`, `transform:scale(${pop(t, K.ka2)});transform-origin:0 50%`);
          if (id === "k90" && t >= K.k90) { const xe = x5(E5.p90) + 13; h += A(X5 - 6, 30, xe - X5 + 6, HB - 30, "", `background:rgba(255,90,78,.14);border-right:6px solid #ff5a4e;opacity:${op(t, K.k90)}`) +
            A(xe + 16, 400, 700, 90, `<div class="panel" style="padding:8px 22px;font-size:40px;white-space:nowrap;display:inline-block;box-shadow:0 0 0 6px #ff5a4e,0 10px 0 rgba(0,0,0,.25)">10人のうち9人はここまで <span class="num" style="font-size:60px;color:#e03131">${E5.p90}回</span></div>`, `transform:scale(${pop(t, K.k90)});transform-origin:0 50%`); }
          if (t >= K.kmax) h += A(x5(E5.max) - 3, 500, 6, 120, "", "background:#ff5a4e;border-radius:3px") + A(x5(E5.max) - 470, 420, 500, 80, `<div class="panel" style="padding:6px 20px;font-size:38px;white-space:nowrap;display:inline-block;float:right">いちばんかかった人 <span class="num" style="color:#e03131;font-size:52px">${E5.max}回</span></div>`, `transform:scale(${pop(t, K.kmax)});transform-origin:100% 50%`);
          return { title: `<span class="g">1万人</span>が全部そろうまでの回数`, html: h };
        }
        if (v === "e5why") {
          const U = 105, ts = [K.kw1, K.kw2, K.kw2 + 0.5, K.kw2 + 1.0, K.kw2 + 1.5, K.kw3]; let h = "";
          for (let i = 0; i < 6; i++) { if (t < ts[i]) continue; const y = 14 + i * 104, last = i === 5, len = E5.stage_theory[i] * U * easeOut(prog(t, ts[i] + 0.1, 0.5)), dimd = id === "kwhy3" && !last ? 0.5 : 1;
            let alb = ""; for (let j = 0; j < 6; j++) alb += `<span class="ball" style="width:30px;height:30px;margin-right:5px;background:${j < i ? "rgba(255,255,255,.25)" : KC[j]}"></span>`;
            h += `<div style="opacity:${op(t, ts[i], 0.2) * dimd}">` + A(0, y, 190, 84, `${i + 1}種類目`, `font-size:40px;line-height:84px;text-align:right;color:${last ? GOLD : "#fff"}`) +
              A(215, y, 230, 84, `<div style="line-height:40px;white-space:nowrap">${alb}</div><div style="font-size:24px;line-height:40px;color:rgba(255,255,255,.85);white-space:nowrap">新しいのは 6個中${6 - i}個</div>`) +
              A(480, y + 12, len, 60, "", `background:${last ? GOLD : "#4da3ff"};border-radius:14px`) +
              A(480 + len + 16, y, 300, 84, `<span class="num" style="font-size:${last ? 64 : 46}px;color:${last ? GOLD : "#fff"}">平均${E5.stage[i].toFixed(i ? 1 : 0).replace(/\.0$/, "")}回</span>`, `line-height:84px;white-space:nowrap;opacity:${op(t, ts[i] + 0.4)}`) + `</div>`; }
          if (t >= K.kw4) h += A(1010, 40, 420, 300, `<div class="panel c" style="height:300px;background:#fff3b0;padding:24px 10px"><div style="font-size:46px">全部足すと</div><div class="num" style="font-size:104px;color:#d9480f;line-height:1.2;white-space:nowrap">${E5.mean_theory}回</div><div style="font-size:30px;color:#5a5f86">1＋1.2＋1.5＋2＋3＋6</div></div>`, `transform:scale(${pop(t, K.kw4)}) rotate(2deg)`);
          return { title: id === "kwhy0" ? `なぜ、<span class="g">こんなにかかる？</span>` : `<span class="g">最後の1種類</span>が出にくい`, html: h + (id === "kwhy0" ? A(0, 200, 1440, 300, `<div class="big c" style="font-size:240px;color:${GOLD};transform:scale(${1 + 0.06 * Math.sin(t * 5)})">？</div>`) : "") };
        }
        if (v === "end") {
          const C = [[K.e1, "①", `1%を100回引いても 当たるのは<span style="color:#d9480f">約${T.W}</span>`], [K.e2, "②", `「そろそろ出る」は <span style="color:#d9480f">ない</span>`], [K.e3, "③", `回数とお金は <span style="color:#d9480f">引く前に決める</span>`]];
          return { title: `今日の<span class="g">まとめ</span>`, html: C.map(([t0, n, l], i) => A(70, 30 + i * 230, 1300, 190, `<div class="panel" style="height:190px;font-size:62px;line-height:142px;white-space:nowrap"><span style="color:#1971c2;font-size:80px;vertical-align:-6px">${n}</span> ${l}</div>`,
            `opacity:${op(t, t0, 0.15)};transform:translateX(${(1 - easeOut(prog(t, t0, 0.4))) * 300}px) rotate(${[-0.8, 0.8, -0.8][i]}deg)`)).join("") };
        }
        // end2：冒頭の問いに答える
        const ans = t >= K.e5;
        if (ans) { g.save(); g.translate(60, 250); g.scale(0.62, 0.62); g.translate(-GX, -GY); grid((i) => (i < E1.win ? GOLD : GRAY)); g.restore(); }
        return { title: `最初の問いの<span class="g">答え</span>`, html:
          A(0, 20, 1440, 180, `<div class="big c" style="font-size:96px;white-space:nowrap">1% × 100回 ＝ 当たる<span class="g">？</span></div>`, `transform:scale(${Math.max(0.6, pop(t, K.e4))})`) +
          (ans ? A(540, 200, 880, 150, `<div class="c">${hz(t, K.e5, "3人に1人は", 96)}</div>`) + A(540, 350, 880, 170, `<div class="c">${hz(t, K.e5 + 0.4, "当たらない", 120)}</div>`) +
            A(60, 695, 440, 40, `${ball(26, GOLD)} 当たった 約${T.W}　${ball(26, GRAY)} 0回 約${T.Z}`, "font-size:26px;white-space:nowrap;text-align:center") : "") +
          (t >= K.e6 ? A(560, 590, 840, 140, `<div class="panel c" style="font-size:42px;line-height:1.35;padding:14px">次に確かめてほしい確率を<br><span style="color:#1971c2">コメントで教えてね！</span></div>`, `transform:scale(${pop(t, K.e6)}) rotate(-1.5deg)`) : "") };
      }

      // ---- 左の目次（いまどの実験か） ----
      function side(t) {
        if (t < K.in4 - 0.2) { $("side").innerHTML = ""; return; }
        let ci = 0; D.chapters.forEach((c, i) => { if (t >= c.start) ci = i; });
        $("side").style.opacity = op(t, K.in4 - 0.2, 0.5);
        $("side").innerHTML = CHS.map((l, i) => { const cur = ci === i + 1, done = ci > i + 1;
          return `<div class="srow" style="background:${cur ? GOLD : "rgba(14,17,48,.5)"};color:${cur ? "#1c2150" : done ? "rgba(255,255,255,.8)" : "rgba(255,255,255,.4)"};transform:scale(${cur ? 1 + 0.06 * Math.max(0, wob(t - D.chapters[ci].start, 3, 5)) : 1});transform-origin:0 50%">${done ? '<span style="color:#69db7c">✓</span> ' : ""}${l}</div>`; }).join("");
      }
      // ---- アリス ----
      const NAMES = ["base", "talk", "talk_half", "blink", "happy", "surprised", "troubled", "pose_thinking", "pose_thinking_talk", "pose_thinking_half", "pose_pointing", "pose_pointing_talk", "pose_pointing_half", "pose_excited", "pose_excited_talk"];
      $("alice").innerHTML = NAMES.map((n) => `<img id="a_${n}" src="assets/alice/${n}_768.png" alt="${n === "base" ? "電脳アリス" : ""}" style="opacity:0">`).join("");
      const AMT = { surprised: 1.0, pose_excited: 0.8, troubled: 0.5 }, MARK = { surprised: "！", pose_thinking: "？", pose_excited: "✨" };
      function alice(t, sc, u) {
        const f = Math.floor(t * D.fps), mo = +D.mouth[Math.min(f, D.mouth.length - 1)] || 0, face = sc.face || "base";
        const half = { base: "talk_half", pose_thinking: "pose_thinking_half", pose_pointing: "pose_pointing_half", pose_excited: "pose_excited" };
        const f0 = face.startsWith("pose_") ? face : (mo ? "base" : face);
        const show = mo === 2 ? (f0 === "base" ? "talk" : f0 + "_talk") : mo === 1 ? half[f0] : (f0 === "base" && t % 3.4 < 0.12 ? "blink" : f0);
        for (const n of NAMES) $("a_" + n).style.opacity = n === show ? 1 : 0;
        const i = D.scenes.indexOf(sc), prev = D.scenes[i - 1], changed = !prev || prev.face !== sc.face;

        const act = changed ? faceAct(t, sc.start, AMT[face] ?? 0.3) : { sx: 1, sy: 1 };
        const en = easeOut(prog(t, 0.1, 0.6)), lean = face === "pose_pointing" ? 2 : 0;
        $("alice").style.transform = `translate(${-(1 - en) * 500 + (lean ? 10 : 0)}px, ${Math.sin(t * 2.2) * 5 + Math.sin(t * 3.7) * 2 + (mo ? -3 : 0)}px) rotate(${Math.sin(t * 1.3) * 0.8 + lean}deg) scale(${act.sx * pre.sx},${act.sy * pre.sy})`;
        const mk = changed && MARK[face] && u < 1.2 ? MARK[face] : "";
        $("mark").innerHTML = mk; $("mark").style.transform = mk ? `scale(${backOut(prog(t, sc.start, .35))}) rotate(${Math.sin(t * 9) * 6}deg)` : ""; $("mark").style.opacity = mk ? 1 - prog(t, sc.start + 0.9, 0.3) : 0;
      }
      function caption(sc, u, t) {
        if (u > sc.voice_len + 0.35) return "";
        const parts = sc.sub.match(/[^。？！…]+[。？！…]*/g) || [sc.sub]; let k = 0;
        for (let i = 0; i < sc.marks.length; i++) if (t >= sc.marks[i][1] - 0.05) k = i;
        let line = (parts[k] || "").replace(/。$/, "");
        if (line.length > 24) { const m = line.length / 2; let b = -1; for (let i = 0; i < line.length - 1; i++) if ("、".includes(line[i]) && (b < 0 || Math.abs(i - m) < Math.abs(b - m))) b = i; if (b < 0 || Math.max(b + 1, line.length - b - 1) > 27) b = Math.floor(m); line = line.slice(0, b + 1) + "\n" + line.slice(b + 1); }
        return line;
      }
      const CBG = { intro: "#2d3577", c1: "#1f558f", c2: "#4f2f86", c3: "#17605e", c4: "#7a3345", c5: "#2f6a3a", end: "#6a5a1f" };
      const hex = (h) => [1, 3, 5].map((j) => parseInt(h.slice(j, j + 2), 16));
      function bgAt(t) {
        let ci = 0; D.chapters.forEach((c, i) => { if (t >= c.start) ci = i; });
        const a = hex(CBG[D.chapters[Math.max(0, ci - 1)].id]), b = hex(CBG[D.chapters[ci].id]), k = prog(t, D.chapters[ci].start, 0.6);
        const dark = D.sil.some(([x, y]) => t >= x && t < y) ? 0.5 : 0;
        return `linear-gradient(rgba(0,0,0,${dark}),rgba(0,0,0,${dark})), radial-gradient(ellipse at 60% 40%, rgb(${a.map((v, j) => Math.round(lerp(v, b[j], k))).join(",")}) 0%, #171b42 70%, #0e1130 100%)`;
      }
      const WCOL = ["#ffc928", "#4da3ff", "#ff6b6b", "#3ccf7a"], TR = 0.3;
      function wipe(t) {
        const j = VB.findIndex((b) => Math.abs(t - b) < TR), w = $("wipe");
        if (j < 0) { if (w.innerHTML) w.innerHTML = ""; return; }
        const p = (t - (VB[j] - TR)) / (2 * TR), dir = j % 2 ? -1 : 1;
        w.innerHTML = [0, 0.14, 0.06, 0.18, 0.1].map((d, i) => { const q = p < 0.5 ? easeOut(clamp((p * 2 - d) / (1 - d))) : easeIn(clamp(((p - 0.5) * 2 - d) / (1 - d)));
          const x0 = p < 0.5 ? 0 : q, x1 = p < 0.5 ? q : 1;
          return `<div style="position:absolute;top:${i * 20}%;height:21%;left:${(dir > 0 ? x0 : 1 - x1) * 100}%;width:${(x1 - x0) * 100}%;background:${WCOL[(j + i) % 4]};transform:skewY(-4deg)"></div>`; }).join("");
      }
      function renderAt(t) {
        t = Math.max(0, Math.min(D.total - 0.001, t));
        let sc = D.scenes[0]; for (const s of D.scenes) if (t >= s.start) sc = s;

      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      document.fonts.ready.then(() => renderAt(0));
      renderAt(0);
