<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/lib/gsap.min.js"></script>
    <script src="assets/lib/motion.js"></script>
    <script src="assets/lib/dots.js"></script>
    <script src="assets/data.js"></script>
    <style>
      @font-face { font-family: R; src: url("assets/fonts/MPLUSRounded1c-ExtraBold.ttf"); font-weight: 800; }
      @font-face { font-family: R; src: url("assets/fonts/MPLUSRounded1c-Bold.ttf"); font-weight: 700; }
      :root { --navy: #1c2150; --gold: #ffc928; --goldd: #d99a00; --gray: #a9adc4; --red: #ff5a4e; --blue: #4da3ff; --ink: #1c2150; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #14183a; font-family: R, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #bg { position: absolute; inset: 0; }
      #dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.07) 3px, transparent 3.5px); background-size: 48px 48px; }
      #ui { position: absolute; inset: 0; }
      #cam { position: absolute; inset: 0; transform-origin: 540px 800px; }
      .big { font-weight: 800; color: #fff; -webkit-text-stroke: 12px var(--navy); paint-order: stroke fill; text-shadow: 6px 6px 0 var(--navy); }
      #title { position: absolute; left: 0; right: 0; top: 100px; text-align: center; font-size: 84px; line-height: 1.18; }
      #stage { position: absolute; left: 50px; right: 50px; top: 400px; height: 860px; }
      #cv { position: absolute; left: 130px; top: 410px; width: 820px; height: 820px; border-radius: 14px; }
      #cap { position: absolute; left: 30px; right: 30px; top: 1290px; text-align: center; font-size: 50px; white-space: pre-line; line-height: 1.28; }
      #alice { position: absolute; right: 150px; bottom: -260px; width: 520px; height: 693px; transform-origin: 50% 100%; filter: drop-shadow(5px 0 0 #fff) drop-shadow(-5px 0 0 #fff) drop-shadow(0 -5px 0 #fff) drop-shadow(8px 10px 0 rgba(0,0,0,.35)); }
      #alice img { position: absolute; inset: 0; width: 520px; height: 693px; transform: scaleX(0.9); transform-origin: 50% 100%; }
      #mark { position: absolute; left: 640px; top: 1450px; font-size: 110px; }
      #wipe { position: absolute; inset: -300px; pointer-events: none; }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
      .panel { background: rgba(255,255,255,.97); border-radius: 36px; box-shadow: 0 0 0 8px #F7F9FB, 0 16px 0 rgba(0,0,0,.25); padding: 30px 38px; color: var(--ink); }
      .ph { font-weight: 800; font-size: 46px; text-align: center; margin-bottom: 18px; }
      .note { font-size: 32px; font-weight: 700; color: #5a5f86; text-align: center; margin-top: 12px; }
      .num { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }
      .hand { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 50%; background: #fff; border: 7px solid var(--navy); }
      .hand .e { font-family: "Noto Color Emoji", sans-serif; line-height: 1; }
      .hand .l { font-weight: 800; color: var(--navy); line-height: 1; }
      .badge { display: inline-block; border-radius: 22px; padding: 4px 20px; font-weight: 800; }
      .hz { display: inline-block; font-weight: 800; color: #FFE23A; -webkit-text-stroke: 10px #fff; paint-order: stroke fill;
        text-shadow: 7px 0 0 #FF3D7F, -7px 0 0 #FF3D7F, 0 7px 0 #FF3D7F, 0 -7px 0 #FF3D7F, 5px 5px 0 #FF3D7F, -5px 5px 0 #FF3D7F, 5px -5px 0 #FF3D7F, -5px -5px 0 #FF3D7F, 0 14px 0 #A3124F, 0 20px 0 #A3124F; }
      .hzg { display: inline-block; font-weight: 800; color: #9aa0bd; -webkit-text-stroke: 10px #fff; paint-order: stroke fill;
        text-shadow: 7px 0 0 #4a4f72, -7px 0 0 #4a4f72, 0 7px 0 #4a4f72, 0 -7px 0 #4a4f72, 5px 5px 0 #4a4f72, -5px 5px 0 #4a4f72, 0 14px 0 #2a2e50; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="178.691" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="178.691" data-track-index="0"></div>
      <div id="ui" class="clip" data-start="0" data-duration="178.691" data-track-index="1" data-layout-allow-overlap data-layout-allow-overflow>
        <div id="dots"></div>
        <div id="cam"><div id="title" class="big"></div><div id="stage"></div><canvas id="cv" width="820" height="820"></canvas></div>
        <div id="alice"></div>
        <div id="mark" class="big"></div>
        <div id="cap" class="big"></div>
        <div id="wipe"></div>
        <div id="flash"></div>
        <div style="position:absolute;right:28px;top:24px;font:700 26px R,sans-serif;color:rgba(255,255,255,.85);text-shadow:0 2px 4px rgba(0,0,0,.6)">VOICEVOX:四国めたん</div>
        <div id="credit" style="position:absolute;left:28px;top:24px;font:700 26px R,sans-serif;color:rgba(255,255,255,.7)"></div>
      </div>
      <audio id="mix" class="clip" src="assets/mix.wav" data-start="0" data-duration="178.691" data-track-index="2"></audio>
    </div>
    <script>window.__timelines = window.__timelines || {}; window.__timelines["main"] = gsap.timeline({ paused: true });</script>
    <script>
      const D = window.DATA, K = D.K, P = D.P;
      const { clamp, lerp, prog, easeOut, easeIn, easeInOut, smooth, backOut, spring, springTo, wob, shakeXY, roll, faceAct } = window.M;
      const $ = (id) => document.getElementById(id);
      const op = (t, t0, d = 0.3) => clamp((t - t0) / d);
      const pop = (t, t0, d = 0.45) => backOut((t - t0) / d);
      const pc = (x) => Math.round(x * 100) + "%";
      const SC = Object.fromEntries(D.scenes.map((s) => [s.id, s]));
      const firstOf = (vis) => D.scenes.find((s) => s.vis === vis);
      const VB = D.scenes.filter((s, i) => i && s.vis !== D.scenes[i - 1].vis).map((s) => s.start);
      const NOWIPE = new Set(["demo2", "demo3", "hund", "man", "ans"].map((v) => firstOf(v).start));
      const HITS = [K.d1_res, K.ten_num, K.hu_num, K.a_num, K.tr_num, K.w_dec, K.tp_num];
      $("credit").textContent = `AIのシミュレーション（各${D.trials.toLocaleString()}回・乱数の種 ${D.seed}）`;
      const GOLD = "#ffc928", GRAY = "#b9bdd3";
      const dec = D.dec, cum = new Int32Array(dec.length + 1);
      for (let i = 0; i < dec.length; i++) cum[i + 1] = cum[i] + (dec[i] === "1");

      // ---- 手のアイコン ----
      const EM = ["✊", "✌️", "✋"], HN = ["グー", "チョキ", "パー"];
      function hand(k, size, o = {}) {
        const bg = o.state === "win" ? GOLD : o.state === "gray" ? "#d5d8e6" : "#fff", bc = o.state === "win" ? "#a86f00" : o.state === "gray" ? "#8a8fae" : "#1c2150";
        return `<div class="hand" style="width:${size}px;height:${size}px;background:${bg};border-color:${bc};opacity:${o.op ?? 1};transform:${o.tf || ""};border-width:${Math.max(3, size * 0.04)}px">
          <div class="e" style="font-size:${size * 0.5}px;filter:${o.state === "gray" ? "grayscale(.85)" : "none"}">${EM[k]}</div>${o.label === false ? "" : `<div class="l" style="font-size:${size * 0.17}px;margin-top:${size * 0.03}px">${HN[k]}</div>`}</div>`;
      }
      function kindsOf(h) { return new Set(h).size; }
      function winnerOf(h) { const u = [...new Set(h)].sort(); if (u.length !== 2) return -1; const [a, b] = u; return (a === 0 && b === 1) || (a === 1 && b === 2) ? a : b; }

      // ---- 決めの一言（花字） ----
      function hz(t, t0, text, size = 110, cls = "hz") {
        return [...text].map((ch, i) => { const u = t - (t0 + 0.08 + i * 2 / 30); if (u < 0) return `<span class="${cls}" style="opacity:0;font-size:${size}px">${ch}</span>`;
          const s = springTo(u), y = -90 * (1 - springTo(u, 0.55, 20)), r = [-7, 4, -3, 6, -5][i % 5] * (1 - springTo(u, 0.45, 18)) + 1.8 * Math.sin(2 * Math.PI * 1.15 * t + i);
          return `<span class="${cls}" style="font-size:${size}px;transform:translate(0,${y + [6, -12, 8, -10, 4][i % 5]}px) rotate(${r}deg) scale(${s})">${ch}</span>`; }).join("");
      }

      // ---- 実演（1回のじゃんけん） ----
      function demo(t, h, go, res, label) {
        const k = kindsOf(h), w = winnerOf(h), done = t >= res;
        const hs = h.map((x, i) => { const t0 = go + i * 0.16, s = t < t0 ? 0 : pop(t, t0, 0.35);
          const st = !done ? "" : k === 2 ? (x === w ? "win" : "gray") : "gray";
          const lift = done && st === "win" ? -26 * easeOut(prog(t, res, 0.3)) : 0;
          return hand(x, 164, { state: st, tf: `translate(0,${lift}px) scale(${s})` }); }).join("");
        const kk = done ? (k === 2 ? `<div style="margin-top:46px">${hz(t, res, HN[w] + "の勝ち！", 112)}</div>` :
          `<div style="margin-top:46px">${hz(t, res, "あいこ", 130, "hzg")}</div><div class="big" style="font-size:54px;margin-top:10px;opacity:${op(t, res + 0.4)}">${k === 3 ? "3種類ぜんぶ出た" : "全員同じ"}</div>`) : "";
        const cnt = t >= go + 1.0 ? `<div class="big" style="font-size:50px;margin-top:22px;opacity:${op(t, go + 1.0)}">出た手は <span style="color:${k === 2 ? GOLD : "#d5d8e6"};font-size:80px">${k}種類</span></div>` : "";
        return { title: label, html: `<div style="display:flex;gap:14px;justify-content:center;margin-top:130px">${hs}</div><div style="text-align:center">${cnt}${kk}</div>` };
      }

      // ---- 1万回の点（canvas） ----
      const cv = $("cv"), g = cv.getContext("2d");
      function drawDots(t, sc) {
        const show = sc.vis === "man" || sc.vis === "ans";
        cv.style.display = show ? "block" : "none"; if (!show) return null;
        g.clearRect(0, 0, 820, 820); g.fillStyle = "rgba(255,255,255,.97)"; g.fillRect(0, 0, 820, 820);
        let shown = 100;
        if (sc.vis === "man") { const u = prog(t, K.m_go, K.m_end - K.m_go); shown = Math.round(100 + 9900 * Math.pow(u, 2.2)); }
        else shown = 10000;
        const sorted = sc.vis === "ans" && t >= K.a_num - 0.02;
        if (sorted) DOTS.sorted(g, { x: 10, y: 10, size: 800, n: 10000, groups: [{ count: D.all, color: GOLD }, { count: 10000 - D.all, color: GRAY }] });
        else DOTS.draw(g, { x: 10, y: 10, size: 800, n: 10000, shown, color: (i) => (dec[i] === "1" ? GOLD : GRAY), empty: "rgba(201,205,230,.35)" });
        if (sorted) { const y = 10 + 50 * 8; g.strokeStyle = "#1c2150"; g.lineWidth = 5; g.setLineDash([16, 12]); g.beginPath(); g.moveTo(4, y); g.lineTo(816, y); g.stroke(); g.setLineDash([]);
          g.fillStyle = "#1c2150"; g.font = "800 34px R"; g.textAlign = "right"; g.fillText("ここまでで半分", 806, y + 42); }
        if (sc.vis === "man" && t < K.m_go + 1.5) { g.strokeStyle = "#ff3d7f"; g.lineWidth = 5; g.strokeRect(6, 6, 808, 16); g.fillStyle = "#ff3d7f"; g.font = "800 40px R"; g.textAlign = "left"; g.fillText("↑ さっきの100回", 20, 70); }
        return shown;
      }

      function stage(t, sc) {
        const v = sc.vis;
        if (v === "hook") {
          const hs = [0, 1, 2, 1, 0].map((k, i) => { const kk = (k + Math.floor(t * 2.5 + i * 0.4)) % 3, b = Math.abs(Math.sin(t * 7.85 + i)) * 26;
            return hand(kk, 160, { tf: `translate(0,${-b}px) scale(${pop(t, 0.3 + i * 0.08)})` }); }).join("");
          return { title: `<span style="font-size:100px">5人でじゃんけん</span>`,
            html: `<div style="display:flex;gap:18px;justify-content:center;margin-top:30px">${hs}</div>
              <div style="text-align:center;margin-top:60px;opacity:${op(t, K.h_q)};transform:scale(${0.6 + 0.4 * pop(t, K.h_q)})"><div class="big" style="font-size:96px;color:var(--gold)">1回で決まる<br>確率は？</div></div>
              <div style="text-align:center;margin-top:36px;opacity:${op(t, K.h2)};transform:scale(${pop(t, K.h2)}) rotate(-4deg)"><span class="badge" style="background:#ff3d7f;color:#fff;font-size:62px">1万回 ためす！</span></div>` };
        }
        if (v === "demo1") return demo(t, D.H10[0], K.d1_go, K.d1_res, `<span style="color:var(--gold)">1回目</span>`);
        if (v === "demo2") return demo(t, D.H10[1], K.d2_go, K.d2_res, `<span style="color:var(--gold)">2回目</span>`);
        if (v === "demo3") return demo(t, D.H10[2], K.d3_go, K.d3_res, `<span style="color:var(--gold)">3回目</span>`);
        if (v === "rule") {
          const rows = [[1, D.H10[2], K.rc13, false], [2, D.H10[0], K.rc2, true], [3, D.H10[1], K.rc13 + 0.5, false]];
          return { title: `決まるのは<br><span style="color:var(--gold)">どんなとき？</span>`, html: `<div class="panel">${rows.map(([k, h, t0, ok]) =>
            `<div style="display:flex;align-items:center;gap:16px;height:200px;border-bottom:3px dashed #c9cde6;opacity:${t < t0 ? 0.12 : 1};transform:scale(${t < t0 ? 1 : 1 + 0.04 * wob(t - t0, 3, 6)})">
              <div style="width:150px;font-size:50px;font-weight:800;color:${ok ? "#b07800" : "#6a6f92"}">${k}種類</div>
              <div style="display:flex;gap:6px">${h.map((x) => hand(x, 96, { label: false, state: t >= t0 ? (ok ? "win" : "gray") : "" })).join("")}</div>
              <div style="flex:1;text-align:right"><span class="badge" style="font-size:46px;background:${ok ? GOLD : "#d5d8e6"};color:${ok ? "#1c2150" : "#4a4f72"}">${ok ? "決まる" : "あいこ"}</span></div></div>`).join("")}
            <div class="note">※全員がグー・チョキ・パーを同じくらいの割合で、でたらめに出す前提</div></div>` };
        }
        if (v === "guess") return { title: `5人で1回で決まるのは`, html: `<div style="display:flex;gap:40px;justify-content:center;margin-top:90px">
          ${[["多い", K.g_a, "⬆"], ["少ない", K.g_b, "⬇"]].map(([l, t0, ar], i) => `<div class="panel" style="width:430px;text-align:center;opacity:${t < t0 ? 0 : 1};transform:scale(${pop(t, t0)}) rotate(${i ? 3 : -3}deg)">
            <div style="font-size:52px;font-weight:800;color:#5a5f86">半分より</div><div style="font-size:120px;font-weight:800">${l}</div><div style="font-size:90px;font-weight:800;color:${i ? "#4da3ff" : "#ff5a4e"}">${ar}</div></div>`).join("")}</div>
          <div class="big" style="text-align:center;font-size:72px;margin-top:70px;opacity:${op(t, K.g_b + 0.8)}">どっち？</div>` };
        if (v === "ten") {
          let n = 0;
          const rows = D.H10.map((h, i) => { const t0 = K.ten_go + i * 0.3, on = t >= t0, ok = dec[i] === "1"; if (on && ok) n++;
            return `<div style="display:flex;align-items:center;gap:10px;height:76px;opacity:${on ? 1 : 0};transform:translateX(${(1 - easeOut(prog(t, t0, 0.25))) * 80}px)">
              <div class="num" style="width:120px;font-size:34px;font-weight:800;color:#5a5f86">${i + 1}回目</div>
              <div style="display:flex;gap:6px">${h.map((x) => hand(x, 66, { label: false, state: ok ? "win" : "gray" })).join("")}</div>
              <div style="flex:1;text-align:right"><span class="badge" style="font-size:36px;background:${ok ? GOLD : "#d5d8e6"};color:${ok ? "#1c2150" : "#4a4f72"}">${ok ? "決まる" : "あいこ"}</span></div></div>`; }).join("");
          const title = t >= K.ten_num ? `10回中 <span class="num" style="color:var(--gold);font-size:120px">${roll(t, K.ten_num, D.first10 + "回", 1, 5)}</span>` : `まず<span style="color:var(--gold)">10回</span>`;
          return { title, html: `<div class="panel" style="padding:20px 34px">${rows}</div>` };
        }
        if (v === "hund") {
          const sh = Math.round(100 * easeInOut(prog(t, K.hu_go, 2.6)));
          const ds = Array.from({ length: 100 }, (_, i) => { const on = i < sh, ok = dec[i] === "1";
            return `<div style="width:56px;height:56px;border-radius:50%;background:${on ? (ok ? GOLD : GRAY) : "#eef0f7"}"></div>`; }).join("");
          const title = t >= K.hu_num ? `100回中 <span class="num" style="color:var(--gold);font-size:120px">${roll(t, K.hu_num, D.first100 + "回", 2, 5)}</span>` : `次は<span style="color:var(--gold)">100回</span>`;
          return { title, html: `<div class="panel"><div style="display:grid;grid-template-columns:repeat(10,56px);gap:12px;justify-content:center">${ds}</div>
            <div style="display:flex;justify-content:center;gap:40px;margin-top:22px;font-size:40px;font-weight:800;opacity:${op(t, K.hu_col)}">
              <span><span style="color:${GOLD}">●</span> 決まった</span><span><span style="color:${GRAY}">●</span> あいこ</span></div></div>` };
        }
        if (v === "man") {
          const shown = Math.round(100 + 9900 * Math.pow(prog(t, K.m_go, K.m_end - K.m_go), 2.2)), n = cum[shown];
          const title = `<span style="font-size:64px">${shown.toLocaleString()}回中</span><br>決まった <span class="num" style="color:var(--gold);font-size:110px">${n.toLocaleString()}回</span>`;
          const note = t < K.m_go + 1.5 ? `<div class="big" style="position:absolute;left:0;right:0;top:-6px;text-align:center;font-size:40px;color:#ff9ec0">↑さっきの100回</div>` : "";
          return { title: t < K.m_go - 0.3 ? `いよいよ<span style="color:var(--gold)">1万回</span><br><span style="font-size:56px">点1つ＝じゃんけん1回</span>` : title, html: "" };
        }
        if (v === "ans") {
          const big = t >= K.a_num ? `<div style="line-height:1">${hz(t, K.a_num, pc(D.all / 10000), 190)}</div>` : `<span style="font-size:72px">1万回中 ${D.all.toLocaleString()}回</span><br>決まったのは…`;
          const th = `<div class="big" style="font-size:36px;text-align:center;margin-top:6px;opacity:${op(t, K.a_th)}">計算で出した答え：${(P[5].p_theory * 100).toFixed(1)}%（シミュレーション ${(P[5].p_sim * 100).toFixed(1)}%）</div>`;
          return { title: big + th, html: "" };
        }
        if (v === "ppl") {
          const ns = [2, 3, 4, 5, 6, 7, 8, 9, 10], T0 = (n) => n <= 2 ? K.p2 : n <= 5 ? lerp(K.p2, K.p5, (n - 2) / 3) : lerp(K.p5, K.p10, (n - 5) / 5);
          const H = 470, BW = 70, X0 = 40, GAP = 22;
          const bars = ns.map((n, i) => { const g0 = easeOut(prog(t, T0(n) - 0.15, 0.5)), p = P[n].p_sim, h = H * p / 0.7 * g0, x = X0 + i * (BW + GAP), y = 540 - h;
            const lab = [2, 5, 10].includes(n) && t >= T0(n) ? `<text x="${x + BW / 2}" y="${y - 18}" text-anchor="middle" font-size="${n === 10 ? 58 : 50}" font-weight="800" fill="${n === 10 ? "#e03131" : "#1c2150"}">${pc(p)}</text>` : "";
            const th = 540 - H * P[n].p_theory / 0.7;
            return `<rect x="${x}" y="${y}" width="${BW}" height="${h}" rx="10" fill="${GOLD}" opacity="${[2, 5, 10].includes(n) || t > K.p_all ? 1 : 0.55}"/>
              <line x1="${x - 4}" x2="${x + BW + 4}" y1="${th}" y2="${th}" stroke="#1c2150" stroke-width="4" opacity="${g0 >= 0.99 ? 0.8 : 0}"/>
              <text x="${x + BW / 2}" y="586" text-anchor="middle" font-size="34" font-weight="800" fill="#5a5f86">${n}人</text>${lab}`; }).join("");
          const arrow = t > K.p_all ? `<path d="M 130 70 Q 470 100 790 400" fill="none" stroke="#ff3d7f" stroke-width="12" stroke-linecap="round" stroke-dasharray="${1000 * easeOut(prog(t, K.p_all, 0.8))} 2000"/>` : "";
          return { title: `人数を<span style="color:var(--gold)">変えると？</span>`, html: `<div class="panel"><div class="ph">1回で決まる割合（各1万回）</div>
            <svg width="904" height="600" style="display:block;font-family:R">${bars}${arrow}</svg>
            <div class="note" style="font-size:28px;margin-top:0">横の線＝計算で出した答え</div></div>` };
        }
        if (v === "tenr") {
          const n = D.r10, items = Array.from({ length: n }, (_, i) => { const t0 = K.tr_go + i * 0.11, last = i === n - 1;
            return `<div style="width:96px;height:96px;border-radius:50%;background:${last ? GOLD : GRAY};display:flex;align-items:center;justify-content:center;font-size:${last ? 30 : 28}px;font-weight:800;color:${last ? "#1c2150" : "#4a4f72"};opacity:${t < t0 ? 0 : 1};transform:scale(${pop(t, t0, 0.25)})">${last ? "決まる" : "あいこ"}</div>`; }).join("");
          return { title: `<span style="color:var(--gold)">10人</span>だと`, html: `<div class="panel"><div style="display:flex;flex-wrap:wrap;gap:14px;justify-content:center">${items}</div>
            <div class="ph num" style="margin-top:30px;font-size:60px;opacity:${op(t, K.tr_num)}">決まるまで 平均 <span style="color:#e03131;font-size:110px">${t >= K.tr_num ? roll(t, K.tr_num, "約" + n + "回", 3, 5) : ""}</span></div>
            <div class="note" style="opacity:${op(t, K.tr_num + 0.6)}">1万回やった平均（${P[10].rounds_sim.toFixed(1)}回）</div></div>` };
        }
        if (v === "why") {
          // 5人の手の出し方 243通りを全部並べる（並びは本当の順番）。最後に種類ごとにまとめる
          const COLS = 27, CS = 32, all = [];
          for (let i = 0; i < 243; i++) { const h = [0, 1, 2, 3, 4].map((j) => Math.floor(i / 3 ** j) % 3); all.push(kindsOf(h)); }
          const order = [...all.keys()].sort((a, b) => ({ 2: 0, 1: 1, 3: 2 }[all[a]] - { 2: 0, 1: 1, 3: 2 }[all[b]]) || a - b), rank = new Array(243);
          order.forEach((id, r) => (rank[id] = r));
          const gp = easeInOut(prog(t, K.w_aiko + 0.4, 1.0));
          const cells = all.map((k, i) => { const r = lerp(i, rank[i], gp), x = (Math.round(r) % COLS) * CS, y = Math.floor(Math.round(r) / COLS) * CS, appear = K.w_tot + (i / 243) * 1.4;
            const col = k === 2 && t >= K.w_dec ? GOLD : k === 1 && t >= K.w_same ? "#1c2150" : k === 3 && t >= K.w_three ? GRAY : "#e4e6f2";
            return `<div style="position:absolute;left:${x}px;top:${y}px;width:${CS - 4}px;height:${CS - 4}px;border-radius:6px;background:${col};opacity:${t < appear ? 0 : 1}"></div>`; }).join("");
          const lab = (t0, col, a, b) => `<div style="display:flex;align-items:center;justify-content:space-between;height:84px;opacity:${op(t, t0)};font-size:46px;font-weight:800"><span><span style="color:${col}">■</span> ${a}</span><span class="num">${b}</span></div>`;
          return { title: `5人の手の出し方<br><span class="num" style="color:var(--gold);opacity:${op(t, K.w_num)}">全部で${P[5].ways}通り</span>`, html: `<div class="panel">
            <div style="position:relative;width:${COLS * CS}px;height:${9 * CS}px;margin:0 auto">${cells}</div>
            <div style="margin-top:28px">${lab(K.w_dec, GOLD, "ちょうど2種類 → 決まる", P[5].ways_dec + "通り")}${lab(K.w_same, "#1c2150", "全員同じ → あいこ", P[5].ways_same + "通り")}${lab(K.w_three, GRAY, "3種類ぜんぶ → あいこ", P[5].ways_three + "通り")}</div>
            <div class="note">□1つ＝5人の手の出し方1通り</div></div>` };
        }
        if (v === "why4") {
          const rows = [3, 5, 10].map((n, i) => { const t0 = K.w4_go + i * 0.7, gw = easeOut(prog(t, t0, 0.6)), q = P[n], W = 900;
            const d = q.ways_dec / q.ways, s = q.ways_same / q.ways, th = q.ways_three / q.ways;
            return `<div style="opacity:${op(t, t0)};margin:12px 0 26px"><div style="font-size:44px;font-weight:800;margin-bottom:8px">${n}人</div>
              <div style="display:flex;height:92px;width:${W * gw}px;border-radius:16px;overflow:hidden">
                <div style="width:${d * 100}%;background:${GOLD};display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;white-space:nowrap">${d > 0.12 ? "決まる" : ""}</div>
                <div style="width:${s * 100}%;background:#1c2150"></div>
                <div style="width:${th * 100}%;background:${GRAY};outline:${t > K.w4_more ? "8px solid #ff3d7f" : "none"};outline-offset:-8px;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;color:#3a3f62;white-space:nowrap">${th > 0.25 ? "3種類ぜんぶ" : ""}</div></div></div>`; }).join("");
          return { title: `人数が<span style="color:var(--gold)">増える</span>と`, html: `<div class="panel">${rows}
            <div class="note" style="opacity:${op(t, K.w4_more)}">灰色（3種類ぜんぶ出る）が、どんどん広がる</div></div>` };
        }
        if (v === "tip") {
          const pk = D.pick, mx = pk.all10_sim;
          const bar = (lab, sub, val, col, t0, t1) => { const gw = easeOut(prog(t, t0, 0.8));
            return `<div style="opacity:${op(t, t0)};margin:18px 0 38px"><div style="font-size:46px;font-weight:800">${lab}</div><div style="font-size:32px;font-weight:700;color:#5a5f86;margin-bottom:10px">${sub}</div>
              <div style="display:flex;align-items:center;gap:20px"><div style="height:96px;border-radius:18px;background:${col};width:${640 * val / mx * gw}px"></div>
              <div class="num" style="font-size:70px;font-weight:800;color:${col};opacity:${op(t, t1)}">${t >= t1 ? roll(t, t1, "約" + Math.round(val) + "回", 5, 5) : ""}</div></div></div>`; };
          const g10 = Array.from({ length: 10 }, () => "●").join(""), g5 = "●●●●●";
          return { title: `大人数なら<span style="color:var(--gold)">分けよう</span>`, html: `<div class="panel"><div class="ph" style="font-size:40px">10人から1人を選ぶまで、じゃんけんの回数</div>
            ${bar(`全員いっぺん <span style="color:#e03131;letter-spacing:-6px">${g10}</span>`, "10人で勝ち残り", pk.all10_sim, "#e03131", K.tp_all, K.tp_all + 1.6)}
            ${bar(`5人ずつ2組 <span style="color:#1971c2;letter-spacing:-6px">${g5}</span> <span style="color:#1971c2;letter-spacing:-6px">${g5}</span>`, "それぞれ代表1人 → 代表2人で決勝（合計）", pk.split_sim, "#1971c2", K.tp_split, K.tp_num)}
            <div class="note">各1万回の平均（2組を同時にやらず、順番にやった回数）</div></div>` };
        }
        if (v === "sum") {
          return { title: `<span style="color:var(--gold)">まとめ</span>`, html: `<div class="panel" style="text-align:center;padding:44px 30px">
            <div style="opacity:${op(t, K.s1)}"><div style="font-size:48px;font-weight:800;color:#5a5f86">5人のじゃんけんが<br>1回で決まるのは</div><div class="num" style="font-size:180px;font-weight:800;color:var(--goldd);line-height:1.1">${pc(P[5].p_sim)}</div></div>
            <div style="opacity:${op(t, K.s2)};font-size:56px;font-weight:800;margin-top:24px;border-top:3px dashed #c9cde6;padding-top:24px">人数が多いほど<br><span style="color:#6a6f92">あいこが増える</span></div></div>` };
        }
        return { title: `次に確かめてほしい<br><span style="color:var(--gold)">ふしぎ</span>は？`, html: `<div class="panel" style="margin-top:20px;text-align:center">
          <div class="ph" style="font-size:44px">これはAIのシミュレーションです</div><div class="note" style="font-size:34px">全員がでたらめに手を出す前提です<br>人数ごとに1万回ずつ計算しました</div></div>
          <div class="panel" style="margin-top:28px;text-align:center"><div style="font-size:58px;font-weight:800">コメントで<br><span style="color:#e03131">教えてね！</span></div></div>` };
      }

      // ---- アリス ----
      const NAMES = ["base", "talk", "talk_half", "blink", "happy", "surprised", "troubled", "pose_thinking", "pose_thinking_talk", "pose_thinking_half", "pose_pointing", "pose_pointing_talk", "pose_pointing_half", "pose_excited", "pose_excited_talk"];
      $("alice").innerHTML = NAMES.map((n) => `<img id="a_${n}" src="assets/alice/${n}_768.png" alt="${n === "base" ? "電脳アリス" : ""}" style="opacity:0">`).join("");
      const AMT = { surprised: 1.0, pose_excited: 0.8, troubled: 0.5 }, MARK = { surprised: "！", pose_thinking: "？", troubled: "💦", pose_excited: "✨" };
      function alice(t, sc, u) {
        const f = Math.floor(t * D.fps), mo = D.mouth[Math.min(f, D.mouth.length - 1)] || 0, face = sc.face || "base";
        const half = { base: "talk_half", pose_thinking: "pose_thinking_half", pose_pointing: "pose_pointing_half", pose_excited: "pose_excited" };
        const f0 = face.startsWith("pose_") ? face : (mo ? "base" : face);
        const show = mo === 2 ? (f0 === "base" ? "talk" : f0 + "_talk") : mo === 1 ? half[f0] : (f0 === "base" && t % 3.4 < 0.12 ? "blink" : f0);
        for (const n of NAMES) $("a_" + n).style.opacity = n === show ? 1 : 0;
        const prev = D.scenes[D.scenes.indexOf(sc) - 1], changed = !prev || prev.face !== sc.face;
        const nx = D.scenes[D.scenes.indexOf(sc) + 1], pre = nx && nx.face !== sc.face ? faceAct(t, nx.start, 0) : { sx: 1, sy: 1 };
        const act = changed ? faceAct(t, sc.start, AMT[face] ?? 0.3) : { sx: 1, sy: 1 };
        const en = easeOut(prog(t, 0.2, 0.7)), lean = face === "pose_pointing" ? -2 : 0;
        $("alice").style.transform = `translate(${(1 - en) * 600 + (lean ? -20 : 0)}px, ${Math.sin(t * 2.2) * 6 + Math.sin(t * 3.7) * 2 + (mo ? -3 : 0)}px) rotate(${Math.sin(t * 1.3) * 0.8 + lean}deg) scale(${act.sx * pre.sx},${act.sy * pre.sy})`;
        const mk = changed && MARK[face] && u < 1.2 ? MARK[face] : "";
        $("mark").innerHTML = mk; $("mark").style.transform = mk ? `scale(${backOut(prog(t, sc.start, .35))}) rotate(${Math.sin(t * 9) * 6}deg)` : ""; $("mark").style.opacity = mk ? 1 - prog(t, sc.start + 0.9, 0.3) : 0;
      }
      function caption(sc, u, t) {
        if (u > sc.voice_len + 0.3) return "";
        const parts = sc.sub.match(/[^。？！…]+[。？！…]*/g) || [sc.sub]; let k = 0;
        for (let i = 0; i < sc.marks.length; i++) if (t >= sc.marks[i][1] - 0.05) k = i;
        let line = (parts[k] || "").replace(/。$/, "");
        if (line.length > 19) { const m = line.length / 2; let b = -1; for (let i = 0; i < line.length; i++) if ("、".includes(line[i]) && (b < 0 || Math.abs(i - m) < Math.abs(b - m))) b = i; if (b < 0) b = Math.floor(m); line = line.slice(0, b + 1) + "\n" + line.slice(b + 1); }
        return line;
      }
      // ---- 背景の色の流れ・カメラ・場面転換 ----
      const BG = { hook: "#2d3577", demo1: "#24508f", demo2: "#24508f", demo3: "#24508f", rule: "#2b4a7a", guess: "#4a2f7a", ten: "#2d3577", hund: "#2d3577", man: "#3a2f6a",
        ans: "#6a5a1f", ppl: "#24508f", tenr: "#7a2f45", why: "#3a2f6a", why4: "#4a2f7a", tip: "#2b5a4a", sum: "#6a5a1f", end: "#2d3577" };
      function bgAt(t, sc) { const i = D.scenes.indexOf(sc), prev = D.scenes[i - 1]; const a = prev ? BG[prev.vis] : BG[sc.vis], b = BG[sc.vis], k = prog(t, sc.start, 1.0);
        const mix = (x, y) => { const p = (h) => [1, 3, 5].map((j) => parseInt(h.slice(j, j + 2), 16)); const A = p(x), B = p(y); return `rgb(${A.map((v, j) => Math.round(lerp(v, B[j], k))).join(",")})`; };
        return `radial-gradient(ellipse at 50% 30%, ${mix(a, b)} 0%, #171b42 62%, #0e1130 100%)`; }
      const WCOL = ["#ffc928", "#4da3ff", "#ff6b6b", "#3ccf7a"], TR = 0.3;
      function wipe(t) {
        const j = VB.findIndex((b) => Math.abs(t - b) < TR && !NOWIPE.has(b)), w = $("wipe");
        if (j < 0) { w.innerHTML = ""; return; }
        const p = (t - (VB[j] - TR)) / (2 * TR), dir = j % 2 ? -1 : 1;
        w.innerHTML = [0, 0.14, 0.06, 0.18, 0.1].map((d, i) => { const q = p < 0.5 ? easeOut(clamp((p * 2 - d) / (1 - d))) : easeIn(clamp(((p - 0.5) * 2 - d) / (1 - d)));
          const x0 = p < 0.5 ? 0 : q, x1 = p < 0.5 ? q : 1;
          return `<div style="position:absolute;top:${i * 20}%;height:21%;left:${(dir > 0 ? x0 : 1 - x1) * 100}%;width:${(x1 - x0) * 100}%;background:${WCOL[(j + i) % 4]};transform:skewY(-6deg)"></div>`; }).join("");
      }
      function renderAt(t) {
        let sc = D.scenes[0]; for (const s of D.scenes) if (t >= s.start) sc = s;
        const u = t - sc.start, first = firstOf(sc.vis);
        $("bg").style.background = bgAt(t, sc);
        $("dots").style.backgroundPosition = `0 ${(t * 12) % 48}px`;
        const r = stage(t, sc);
        drawDots(t, sc);
        $("stage").innerHTML = r.html; $("title").innerHTML = r.title;
        $("title").style.transform = `scale(${0.7 + 0.3 * backOut(prog(t, first.start, 0.5))})`;
        // 答えの直前（無音）は画面も止める：カメラの寄りをその間だけ止める
        const still = t > K.a_num - 0.6 && t < K.a_num;
        const z = 1 + 0.01 * Math.min(t - first.start, 6), hit = HITS.find((h) => t >= h && t < h + 0.35);
        const [sx, sy] = hit ? shakeXY(t, 12 * (1 - (t - hit) / 0.35)) : [0, 0], bump = HITS.reduce((s, h) => s + spring(t, h, 7, 22), 0) * 0.015;
        $("cam").style.transform = still ? `scale(${z})` : `translate(${sx + 4 * Math.sin(t * 0.5)}px,${sy}px) scale(${z + bump})`;
        $("cap").textContent = t < D.lead ? "" : caption(sc, u, t);
        alice(t, sc, u); wipe(t);
        $("flash").style.opacity = hit ? 0.3 * (1 - (t - hit) / 0.35) : 0;
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      document.fonts.ready.then(() => renderAt(0));
      renderAt(0);
    </script>
  </body>
</html>
