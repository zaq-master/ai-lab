        drawLCD(u, null);
        const L = [`当たりの半分はチャージ。RUSHは約1/${ST.r784}`, `RUSHに入れば 平均約${fmt(ST.avg_rush)}個`, `1日の勝率は ${(ST.win_day * 100).toFixed(0)}%（${ST.rate}回転・等価）`, "決めるのは 運 ＋ 回転率"];
        return { chapter: "まとめ", panel: `<div class="glass" style="width:1100px">${L.map((s, i) => `<div style="display:flex;gap:24px;align-items:center;padding:14px 0;opacity:${fade(u, 0.6 + i * 1.8)}"><div class="big" style="font-size:64px;color:#7a5cff;width:60px">${i + 1}</div><div style="font-size:48px;font-weight:800;color:#2a2f5a">${s}</div></div>`).join("")}</div>` };
      };
      SC.end = (u, d) => {
        cam(u / d, M(5, 6, 14, 5), M(0, 9, 30, 5));
        drawLCD(u, "777");
        const L = ["この動画はAIがシミュレーションして制作しています", "数値は公開情報から。実際の台・お店の条件で変わります", "必勝法ではありません。18歳未満は遊技できません"];
        return { chapter: "", panel: `<div class="glass" style="width:1220px;text-align:center">${L.map((s, i) => `<div style="font-size:38px;font-weight:700;color:#2a2f5a;padding:12px 0;opacity:${fade(u, 0.5 + i * 0.6)}">${s}</div>`).join("")}
          <div class="stat" style="font-size:26px;margin-top:14px">条件：1万人・乱数の種 ${ST.seed}／音声：Style-BertVITS2モデル 小春音アミ、あみたろの声素材工房（amitaro.net）／キャラ画像：Canvaで生成</div></div>` };
      };

      // ---------- アリス ----------
      let hype = 0;
      const ALICE = ["base", "talk", "blink", "happy", "surprised", "troubled", "pose_thinking", "pose_thinking_talk", "pose_pointing", "pose_pointing_talk", "pose_excited", "pose_excited_talk"];
      function alice(t, sc, u) {
        const f = Math.floor(t * FPS), mo = D.mouth[Math.min(f, D.mouth.length - 1)] || 0;
        const face = (sc && sc.face) || "base";
        let show;
        if (face === "base") show = mo >= 1 ? "talk" : (t % 3.7 < 0.13 ? "blink" : "base");
        else if (face.startsWith("pose_")) show = mo >= 1 ? face + "_talk" : face;
        else show = face;
        for (const n of ALICE) $("a_" + n).style.opacity = n === show ? 1 : 0;
        const enter = out3(clamp((t - 0.6) / 0.9));
        const pop = sc && u < 0.35 ? Math.sin((u / 0.35) * Math.PI) * 0.035 : 0;     // 表情が変わる瞬間に少し弾む
        const sway = Math.sin(t * 1.3) * 0.8, bob = Math.sin(t * 2.1) * 5 + (mo ? -2 : 0) - Math.abs(Math.sin((1 - hype) * Math.PI * 3)) * 40 * hype;
        const breath = 1 + Math.sin(t * 2.1) * 0.006;
        const el = $("alice");
        el.style.opacity = 1;
        el.style.transform = `translate(${(1 - enter) * 600}px, ${bob}px) rotate(${sway}deg) scale(${(1 + pop) / breath}, ${(1 + pop) * breath})`;
      }

      // ---------- 演出：雲・切り替えの帯・集中線・紙吹雪・揺れ ----------
      const CLOUDS = [0, 1, 2, 3, 4, 5].map((i) => ({ x: (i * 397) % 1900, y: 40 + ((i * 131) % 220), w: 220 + ((i * 89) % 180), sp: 6 + (i % 3) * 4 }));
      $("sky").innerHTML = CLOUDS.map((c, i) => `<div class="cloud" id="cl${i}" style="width:${c.w}px;height:${c.w * 0.32}px;top:${c.y}px"></div>`).join("");
      function sky(t) { CLOUDS.forEach((c, i) => { $("cl" + i).style.left = (((c.x + t * c.sp) % 2400) - 300) + "px"; }); }
      function wipe(t) {
        // 次の場面の頭で、帯が左から右へ画面を横切る（前0.3秒で覆い、後0.35秒で抜ける）
        let k = -1;
        for (const s of D.scenes) { const dt = t - s.start; if (s !== D.scenes[0] && dt > -0.3 && dt < 0.35) k = dt < 0 ? (dt + 0.3) / 0.3 : 1 + dt / 0.35; }
        const bands = $("wipe").children;
        for (let i = 0; i < 3; i++) {
          const kk = k < 0 ? -1 : k - i * 0.08;
          const x = kk < 0 ? -1400 : kk <= 1 ? lerp(-1400, 0, out3(kk)) * 1 + i * 520 : lerp(i * 520, 2600, ease(kk - 1));
          bands[i].style.left = x + "px"; bands[i].style.width = (kk >= 0 && kk <= 1.02 ? 1600 : 1000) + "px";
        }
      }
      const FX = D.fx;
      function burst(u, at) {
        const k = (u - at) / 1.3;
        if (k < 0 || k > 1) { $("burst").innerHTML = ""; $("confetti").innerHTML = ""; return 0; }
        const r0 = 260 + 500 * out3(k), r1 = r0 + 260 + 400 * out3(k), op = (1 - k) * 0.85;
        let svg = "";
        for (let i = 0; i < 36; i++) {
          const a = (i / 36) * Math.PI * 2 + 0.05, w = i % 2 ? 0.035 : 0.02;
          const p = (r) => [700 + Math.cos(a) * r, 520 + Math.sin(a) * r * 0.75];
          const [x0, y0] = p(r0), [x1, y1] = p(r1), [x2, y2] = [700 + Math.cos(a + w) * r1, 520 + Math.sin(a + w) * r1 * 0.75];
          svg += `<polygon points="${x0},${y0} ${x1},${y1} ${x2},${y2}" fill="${i % 3 ? "#ffd84a" : "#ffffff"}" opacity="${op}"/>`;
        }
        $("burst").innerHTML = svg;
        let cf = "";
        const cols = ["#ff4d4d", "#ffd84a", "#2f7bff", "#3ad29f", "#ff7ad9"];
        for (let i = 0; i < 70; i++) {
          const sx = (i * 977) % 1500 + 60, vx = (((i * 37) % 21) - 10) * 18, vy = -380 - ((i * 53) % 300);
          const tt = k * 1.3, x = sx + vx * tt, y = 700 + vy * tt + 900 * tt * tt;
          cf += `<div class="confetti" style="left:${x}px;top:${y}px;background:${cols[i % 5]};opacity:${1 - k * 0.6};transform:rotate(${(i * 47 + tt * 540 * (i % 2 ? 1 : -1)) % 360}deg)"></div>`;
        }
        $("confetti").innerHTML = cf;
        return 1 - k;
      }

      // ---------- 字幕：声の進み具合で1文ずつ ----------
      function balance(s) {
        if (s.length <= 32) return s;
        const mid = s.length / 2;
        let best = -1;
        for (let i = 0; i < s.length - 1; i++) if ("、」）".includes(s[i]) && (best < 0 || Math.abs(i - mid) < Math.abs(best - mid))) best = i;
        if (best < 0 || Math.abs(best - mid) > s.length * 0.3) best = Math.floor(mid);
        return s.slice(0, best + 1) + "\n" + s.slice(best + 1);
      }
      function caption(sc, u) {
        if (!sc || u > sc.voice_len + 0.6) return "";
        const parts = sc.sub.match(/[^。？！]+[。？！]?/g) || [sc.sub];
        const total = parts.reduce((a, s) => a + s.length, 0), prog = u / sc.voice_len;
        let acc = 0;
        let line = parts[parts.length - 1];
        for (const p of parts) { acc += p.length; if (acc / total >= prog) { line = p; break; } }
        return balance(line);
      }

      const objs = { cab, crowd, barGroup, steps3, pods };
      const SHOW = { hook: ["crowd"], open: ["cab"], spec: ["cab"], lt: ["steps3"], trick: ["cab"], exp1: ["crowd"], chain: ["barGroup"], avg: ["cab"],
        cost: ["barGroup"], cost2: ["crowd"], day: ["crowd", "barGroup"], dayext: ["crowd"], rates: ["pods"], month: ["crowd"], summary: ["cab"], end: ["cab"] };

      function renderAt(t) {
        let sc = D.scenes[0];
        for (const s of D.scenes) if (t >= s.start) sc = s;
        const before = t < D.scenes[0].start;
        const u = before ? 0 : t - sc.start, d = sc.dur;
        const show = SHOW[sc.id] || [];
        for (const [k, o] of Object.entries(objs)) o.visible = show.includes(k);
        if (sc.id === "day") barGroup.visible = u >= 9;
        crowdT = t; drawBalls(t); drawDust(t); sky(t); wipe(t); drawCabFx(t);
        const r = (SC[sc.id] || (() => ({})))(u, d) || {};
        $("panel").innerHTML = r.panel || "";
        $("title").innerHTML = r.title || "";
        $("labels").innerHTML = r.labels || "";
        $("chapter").textContent = r.chapter || "";
        $("chapter").style.opacity = r.chapter ? 1 : 0;
        const fadeIn = clamp(u / 0.35);
        $("panel").style.opacity = fadeIn; $("title").style.opacity = fadeIn; $("labels").style.opacity = fadeIn;
        $("captext").textContent = before ? "" : caption(sc, u);
        hype = FX[sc.id] !== undefined ? burst(u, FX[sc.id]) : burst(-1, 0);
        const shake = hype > 0.6 ? (hype - 0.6) * 2.5 : 0;
        $("ui").style.transform = shake ? `translate(${Math.sin(t * 90) * 10 * shake}px, ${Math.cos(t * 77) * 8 * shake}px)` : "";
        alice(t, sc, u);
        composer.render();
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      document.fonts.ready.then(() => renderAt(0));
      renderAt(0);
    </script>
  </body>
</html>
