<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{fulltitle}}</title>
<meta name="description" content="{{desc}}">
<link rel="canonical" href="{{url}}">
<link rel="alternate" type="application/rss+xml" title="{{site}}（RSS）" href="{{feed}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{desc}}">
<meta property="og:url" content="{{url}}">
<meta property="og:type" content="{{ogtype}}">
<meta property="og:site_name" content="{{site}}">
<meta property="og:locale" content="ja_JP">
{{ogimage}}<meta name="twitter:card" content="{{twcard}}">
<meta name="twitter:site" content="@qol_gadget_life">
{{jsonld}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f8fa;--fg:#1d2330;--sub:#5b6475;--card:#fff;--line:#e3e6ec;--acc:#3b5bdb;--pr:#fff7e6}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--fg:#e8ebf1;--sub:#9aa3b5;--card:#1b1f29;--line:#2b3140;--acc:#8ea6ff;--pr:#2a2416}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans JP",system-ui,sans-serif;line-height:1.85}
a{color:var(--acc)}header,footer{max-width:760px;margin:auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header .logo{font-weight:700;text-decoration:none;color:var(--fg)}nav a{margin-left:14px;font-size:.9rem;text-decoration:none}
main{max-width:760px;margin:auto;padding:0 16px 40px}
.hero{padding:32px 0 8px}.hero h1{margin:0 0 6px;font-size:1.7rem}.hero p{color:var(--sub);margin:0}
.list{display:grid;gap:14px;margin-top:20px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-decoration:none;color:var(--fg)}
.card h2{font-size:1.1rem;margin:4px 0}.card p{margin:0;color:var(--sub);font-size:.92rem}
.meta{color:var(--sub);font-size:.82rem}
article{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:16px}
article h1{font-size:1.5rem;line-height:1.5}article h2{border-left:4px solid var(--acc);padding-left:10px;margin-top:2em}
.pr{background:var(--pr);border-radius:8px;padding:8px 12px;font-size:.85rem;color:var(--sub)}
table{border-collapse:collapse;width:100%;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;background:linear-gradient(to right,var(--card) 30%,rgba(255,255,255,0)) left center/24px 100% no-repeat local,linear-gradient(to left,var(--card) 30%,rgba(255,255,255,0)) right center/24px 100% no-repeat local,radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.22),rgba(0,0,0,0)) left center/10px 100% no-repeat scroll,radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.22),rgba(0,0,0,0)) right center/10px 100% no-repeat scroll}
th,td{border:1px solid var(--line);padding:8px;font-size:.9rem;white-space:normal;overflow-wrap:break-word;line-break:strict}td.nw{white-space:nowrap}[style*="background:#"] table{background:none}
[style*="background:#f"]{color:#1d2330}[style*="background:#f"] a{color:#3b5bdb}[style*="background:#f"] th,[style*="background:#f"] td{border-color:#e3e6ec}[style*="background:#f"] .badge{background:#fff7e6;color:#5b6475}
@media (max-width:600px){article{padding:16px 12px}th,td{padding:6px 4px;font-size:.82rem;line-height:1.6}th{white-space:normal}td.nw:first-child{white-space:normal}}
.prods{margin-top:2em}.prod{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}.prod-l{font-weight:700;margin:0 0 6px}.badge{font-size:.7rem;background:var(--pr);border-radius:4px;padding:2px 6px;vertical-align:middle}
.buy{display:inline-block;background:#bf0000;color:#fff;padding:10px 16px;border-radius:8px;text-decoration:none;font-weight:700;font-size:.92rem}
.eye{width:100%;height:auto;border-radius:10px;display:block;margin-bottom:10px}
footer{color:var(--sub);font-size:.85rem;border-top:1px solid var(--line)}
.hub{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.hub-main{display:block;border-radius:10px;padding:14px 16px;text-decoration:none;color:#fff;background:linear-gradient(135deg,#3b5bdb,#15aabf)}
.hub-main b{display:block;font-size:1.2rem;margin:4px 0 2px}.hub-main span:last-child{font-size:.88rem;opacity:.95}.hub-main .badge{color:var(--fg)}
.hub h2{font-size:1rem;margin:14px 0 8px}
.tools{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.tools a{display:block;height:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-decoration:none;color:var(--fg)}
.tools a:hover,.hub-main:hover{border-color:var(--acc);opacity:.92}
.tools b{display:block;font-size:.95rem;color:var(--acc)}.tools span{display:block;font-size:.82rem;color:var(--sub);line-height:1.5}
.related{margin-top:2.5em;padding:1em 1.2em;border-radius:12px;background:rgba(127,127,127,.08)}.related h2{margin-top:0;font-size:1.1em}
</style>
</head>
<body>
<header><a class="logo" href="{{p}}index.html">{{site}}</a>
<nav><a href="{{p}}about.html">運営者・方針</a><a href="{{x}}">X</a><a href="{{ig}}">Instagram</a><a href="{{note}}">note</a></nav></header>
<main>{{body}}</main>
<footer>© {{year}} {{site}} ／ 運営：{{author}}（AIを活用して運営しています）<br>当サイトは楽天アフィリエイトなどのアフィリエイト広告を利用しています。</footer>
</body>
</html>
