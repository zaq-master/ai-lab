# IndexNow：docs/ が更新されたら、Pages 配信後に sitemap の全URLを IndexNow（Bing・Yandex・Naver・Seznam 等で共有）へ通知する。
# 説明は ops/seo/indexnow.md。外部Actionは actions/checkout のみ。アカウント・シークレット不要（鍵は公開ファイル）。
name: IndexNow

on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

concurrency:
  group: indexnow
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Pages 配信を待つ（鍵ファイルが200で取れるまで）
        run: |
          KEY=$(python3 -c "import json;print(json.load(open('config.json'))['indexnow_key'])")
          URL="https://zaq-master.github.io/ai-lab/${KEY}.txt"
          sleep 120
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /tmp/key.txt -w '%{http_code}' "$URL" || true)
            echo "try $i: $URL -> $CODE"
            if [ "$CODE" = "200" ] && [ "$(tr -d '[:space:]' < /tmp/key.txt)" = "$KEY" ]; then exit 0; fi
            sleep 30
          done
          echo "::error::key file not reachable: $URL"; exit 1

      - name: sitemap の全URLを IndexNow に送信
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, urllib.error
          key = json.load(open("config.json"))["indexnow_key"]
          urls = re.findall(r"<loc>([^<]+)</loc>", open("docs/sitemap.xml", encoding="utf-8").read())
          # 鍵を /ai-lab/ に置くため、送れるのはその配下のURLだけ（仕様：鍵の場所が送信範囲を決める）
          urls = [u for u in urls if u.startswith("https://zaq-master.github.io/ai-lab/")][:10000]
          body = {"host": "zaq-master.github.io", "key": key,
                  "keyLocation": f"https://zaq-master.github.io/ai-lab/{key}.txt", "urlList": urls}
          print(f"submitting {len(urls)} urls")
          req = urllib.request.Request("https://api.indexnow.org/IndexNow", data=json.dumps(body).encode(),
                                       headers={"Content-Type": "application/json; charset=utf-8"}, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  code, text = r.status, r.read().decode(errors="replace")
          except urllib.error.HTTPError as e:
              code, text = e.code, e.read().decode(errors="replace")
          meaning = {200: "OK（受理）", 202: "受理・鍵の検証待ち（正常）", 400: "パラメータ不正", 403: "鍵が取れない/一致しない",
                     422: "URLが鍵の範囲外 or keyLocation不正", 429: "送りすぎ"}.get(code, "?")
          print(f"IndexNow response: {code} {meaning} {text[:300]}")
          if code not in (200, 202):
              raise SystemExit(f"::error::IndexNow returned {code}")
          PY
