<h1>電気代の計算式、<br><span>3ステップで覚える</span></h1>
<div class="formula">W <span>÷1000</span> × 時間 × 単価</div>
<div class="step"><div class="num">1</div><div><b>W ÷ 1000 ＝ kW</b><p>ワットを「キロワット」に直す（100W → 0.1kW）</p></div></div>
<div class="step"><div class="num">2</div><div><b>kW × 時間 ＝ kWh</b><p>使った電気の量。検針票の単位と同じ</p></div></div>
<div class="step"><div class="num">3</div><div><b>kWh × 単価 ＝ 円</b><p>単価は検針票やWeb明細で確認。目安なら31円/kWh</p></div></div>
<div class="ex">例）100Wを8時間<br><b>0.1 × 8 × 31 ＝ 約25円</b></div>
<div class="src">目安単価31円/kWh（税込）＝全国家庭電気製品公正取引協議会。実際は契約プラン・燃料費調整額などで変わります。</div>
